<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Bio Cá Nhân</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 1. HIỆU ỨNG NỀN ĐỘNG (ANIMATED GRADIENT) */
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #172554);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 2. HIỆU ỨNG KHUNG BIO XUẤT HIỆN MƯỢT MÀ */
        .bio-container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            padding: 40px 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* 3. HIỆU ỨNG AVATAR VIỀN PHÁT SÁNG NGHỆ THUẬT */
        .avatar-wrap {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 18px auto;
        }

        .avatar-wrap::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            background: linear-gradient(45deg, #38bdf8, #818cf8, #c084fc, #38bdf8);
            background-size: 300%;
            border-radius: 50%;
            z-index: 0;
            animation: steam 6s linear infinite;
        }

        @keyframes steam {
            0% { background-position: 0 0; }
            50% { background-position: 300% 0; }
            100% { background-position: 0 0; }
        }

        .avatar {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0f172a;
        }

        /* Tên & Mô tả */
        .name {
            font-size: 1.45rem;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .name i {
            color: #38bdf8;
            font-size: 1.1rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .bio-text {
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* 4. HIỆU ỨNG CÁC NÚT LINK ĐỘNG (HOVER & SHIMMER) */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .bio-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            padding: 16px 20px;
            border-radius: 18px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Vệt sáng lướt qua nút */
        .bio-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 20%;
            height: 200%;
            background: rgba(255, 255, 255, 0.25);
            transform: rotate(30deg);
            transition: all 0.6s ease;
        }

        .bio-btn:hover::after {
            left: 130%;
        }

        .bio-btn span {
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 1;
        }

        .bio-btn i.icon-left {
            font-size: 1.35rem;
            width: 26px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .bio-btn i.icon-right {
            font-size: 0.85rem;
            color: #94a3b8;
            transition: transform 0.3s ease, color 0.3s ease;
            z-index: 1;
        }

        /* Hover hiệu ứng cho từng nút */
        .bio-btn:hover {
            transform: translateY(-3px) scale(1.02);
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .bio-btn:hover i.icon-left {
            transform: scale(1.2) rotate(8deg);
        }

        .bio-btn:hover i.icon-right {
            transform: translateX(6px);
            color: #ffffff;
        }

        /* Đổ màu viền riêng biệt khi hover */
        .bio-btn.fb:hover { box-shadow: 0 8px 25px rgba(24, 119, 242, 0.35); }
        .bio-btn.tiktok:hover { box-shadow: 0 8px 25px rgba(255, 255, 255, 0.25); }
        .bio-btn.discord:hover { box-shadow: 0 8px 25px rgba(88, 101, 242, 0.35); }

        .footer {
            margin-top: 32px;
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="bio-container">
        <!-- Ảnh đại diện có viền sáng chuyển màu -->
        <div class="avatar-wrap">
            <img src="https://via.placeholder.com/150" alt="Avatar" class="avatar">
        </div>

        <!-- Tên cá nhân -->
        <h1 class="name">
            Lê Bảo Trung
            <i class="fa-solid fa-circle-check" title="Verified"></i>
        </h1>
        
        <!-- Tiểu sử ngắn -->
        <p class="bio-text">
            Welcome to my social links! 👋
        </p>

        <!-- Danh sách 3 Link có hiệu ứng động -->
        <div class="links-list">
            <!-- Facebook -->
            <a href="https://facebook.com" target="_blank" class="bio-btn fb">
                <span><i class="fa-brands fa-facebook icon-left" style="color: #1877f2;"></i> Facebook</span>
                <i class="fa-solid fa-chevron-right icon-right"></i>
            </a>

            <!-- TikTok -->
            <a href="https://tiktok.com" target="_blank" class="bio-btn tiktok">
                <span><i class="fa-brands fa-tiktok icon-left" style="color: #ffffff;"></i> TikTok</span>
                <i class="fa-solid fa-chevron-right icon-right"></i>
            </a>

            <!-- Discord -->
            <a href="https://discord.com" target="_blank" class="bio-btn discord">
                <span><i class="fa-brands fa-discord icon-left" style="color: #5865f2;"></i> Discord Server</span>
                <i class="fa-solid fa-chevron-right icon-right"></i>
            </a>
        </div>

        <!-- Chân trang -->
        <div class="footer">
            <p>© 2026 • Dev Lê Trung</p>
        </div>
    </div>

</body>
</html>
