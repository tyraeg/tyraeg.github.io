<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Bio & Music Hub</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #172554);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bio-container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            padding: 32px 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Music Player Widget */
        .music-player {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }

        .music-info {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }

        .music-info i.fa-compact-disc {
            font-size: 1.4rem;
            color: #38bdf8;
        }

        .music-info i.fa-compact-disc.playing {
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .music-text h4 {
            font-size: 0.85rem;
            font-weight: 600;
            color: #f8fafc;
        }

        .music-text p {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .music-controls button {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .music-controls button:hover {
            background: #38bdf8;
            color: #0f172a;
        }

        /* Avatar */
        .avatar-wrap {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 16px auto;
        }

        .avatar-wrap::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            background: linear-gradient(45deg, #38bdf8, #818cf8, #c084fc, #38bdf8);
            background-size: 300%;
            border-radius: 50%;
            z-index: 0;
            animation: steam 6s linear infinite;
        }

        @keyframes steam {
            0% { background-position: 0 0; }
            50% { background-position: 300% 0; }
            100% { background-position: 0 0; }
        }

        .avatar {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0f172a;
        }

        /* Name & Bio */
        .name {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .name i {
            color: #38bdf8;
            font-size: 1rem;
        }

        .bio-text {
            font-size: 0.88rem;
            color: #cbd5e1;
            margin-bottom: 24px;
        }

        /* Links List */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .bio-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            padding: 15px 20px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bio-btn span {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .bio-btn i.icon-left {
            font-size: 1.25rem;
            width: 24px;
            text-align: center;
        }

        .bio-btn i.icon-right {
            font-size: 0.8rem;
            color: #94a3b8;
            transition: transform 0.3s ease;
        }

        .bio-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .bio-btn:hover i.icon-right {
            transform: translateX(4px);
            color: #ffffff;
        }

        .bio-btn.fb:hover { box-shadow: 0 6px 20px rgba(24, 119, 242, 0.3); }
        .bio-btn.tiktok:hover { box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2); }
        .bio-btn.discord:hover { box-shadow: 0 6px 20px rgba(88, 101, 242, 0.3); }

        .footer {
            margin-top: 28px;
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="bio-container">
        <!-- Trình phát nhạc nền (Music Player) -->
        <div class="music-player">
            <div class="music-info">
                <i class="fa-solid fa-compact-disc" id="discIcon"></i>
                <div class="music-text">
                    <h4>Background Music</h4>
                    <p id="musicStatus">Nhấn để phát nhạc</p>
                </div>
            </div>
            <div class="music-controls">
                <button onclick="toggleAudio()"><i class="fa-solid fa-play" id="playIcon"></i></button>
            </div>
        </div>

        <!-- Thẻ Audio ẩn (Bạn có thể thay link nhạc MP3 trực tuyến vào thuộc tính src) -->
        <audio id="bgMusic" loop>
            <source src="https://www.bensound.com/bensound-music/bensound-cute.mp3" type="audio/mp3">
        </audio>

        <!-- Avatar -->
        <div class="avatar-wrap">
            <img src="https://via.placeholder.com/150" alt="Avatar" class="avatar">
        </div>

        <!-- Tên cá nhân -->
        <h1 class="name">
            Lê Bảo Trung
            <i class="fa-solid fa-circle-check" title="Verified"></i>
        </h1>
        
        <!-- Tiểu sử -->
        <p class="bio-text">
            Welcome to my social links! 👋
        </p>

        <!-- 3 Link theo yêu cầu -->
        <div class="links-list">
            <!-- Facebook -->
            <a href="https://facebook.com" target="_blank" class="bio-btn fb">
                <span><i class="fa-brands fa-facebook icon-left" style="color: #1877f2;"></i> Facebook</span>
                <i class="fa-solid fa-chevron-right icon-right"></i>
            </a>

            <!-- TikTok -->
            <a href="https://tiktok.com" target="_blank" class="bio-btn tiktok">
                <span><i class="fa-brands fa-tiktok icon-left" style="color: #ffffff;"></i> TikTok</span>
                <i class="fa-solid fa-chevron-right icon-right"></i>
            </a>

            <!-- Discord -->
            <a href="https://discord.com" target="_blank" class="bio-btn discord">
                <span><i class="fa-brands fa-discord icon-left" style="color: #5865f2;"></i> Discord Server</span>
                <i class="fa-solid fa-chevron-right icon-right"></i>
            </a>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>© 2026 • Paw</p>
        </div>
    </div>

    <!-- Script điều khiển nhạc -->
    <script>
        const audio = document.getElementById('bgMusic');
        const playIcon = document.getElementById('playIcon');
        const discIcon = document.getElementById('discIcon');
        const musicStatus = document.getElementById('musicStatus');
        let isPlaying = false;

        function toggleAudio() {
            if (isPlaying) {
                audio.pause();
                playIcon.className = "fa-solid fa-play";
                discIcon.classList.remove("playing");
                musicStatus.innerText = "Đã tạm dừng";
                isPlaying = false;
            } else {
                audio.play().then(() => {
                    playIcon.className = "fa-solid fa-pause";
                    discIcon.classList.add("playing");
                    musicStatus.innerText = "Đang phát nhạc...";
                    isPlaying = true;
                }).catch(e => {
                    console.log("Audio play blocked:", e);
                });
            }
        }
    </script>

</body>
</html>
