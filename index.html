<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio • PawDev</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #0b0f1a 0%, #1a1f2e 100%);
      padding: 2rem 1rem;
      overflow-x: hidden;
      perspective: 1000px;
    }

    /* =========================================
       MÀN HÌNH CHỜ (SPLASH SCREEN)
       ========================================= */
    .splash-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: linear-gradient(145deg, #0b0f1a 0%, #1a1f2e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .splash-screen::before {
      content: '';
      position: absolute;
      width: 50vmax; height: 50vmax;
      background: radial-gradient(circle, rgba(100, 210, 255, 0.1) 0%, transparent 60%);
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: -1;
    }

    .splash-text {
      color: #fff;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 15px;
      opacity: 0;
      transform: translateY(20px) scale(0.9);
      animation: smoothAppear 1.2s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
      text-shadow: 0 0 20px rgba(100, 180, 255, 0.5);
    }

    .splash-subtext {
      color: #8fa5cc;
      font-size: 1rem;
      letter-spacing: 1px;
      opacity: 0;
      transform: translateY(10px);
      animation: smoothAppear 1s cubic-bezier(0.2, 0.9, 0.3, 1) 0.3s forwards;
    }

    .splash-dot {
      margin-top: 40px;
      width: 8px; height: 8px;
      background-color: #5d9eff;
      border-radius: 50%;
      animation: pulseDot 1.5s infinite;
    }

    @keyframes smoothAppear {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes pulseDot {
      0% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 0 0 rgba(93, 158, 255, 0.7); }
      70% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 10px rgba(93, 158, 255, 0); }
      100% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 0 0 rgba(93, 158, 255, 0); }
    }

    /* =========================================
       BACKGROUND PARTICLES (ĐOM ĐÓM BAY)
       ========================================= */
    .particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      opacity: 0;
      filter: blur(1px);
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
      10% { opacity: 0.4; }
      90% { opacity: 0.4; }
      100% { transform: translateY(-100vh) translateX(20px) scale(1.5); opacity: 0; }
    }

    /* Hiệu ứng ánh sáng nền */
    .glow {
      position: fixed;
      width: 60vmax; height: 60vmax;
      background: radial-gradient(circle, rgba(100, 210, 255, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      top: -20vmax; left: -20vmax;
      z-index: 0;
      pointer-events: none;
      animation: floatGlow 14s infinite alternate ease-in-out;
    }

    .glow2 {
      position: fixed;
      width: 70vmax; height: 70vmax;
      background: radial-gradient(circle, rgba(200, 100, 255, 0.12) 0%, transparent 70%);
      border-radius: 50%;
      bottom: -30vmax; right: -20vmax;
      z-index: 0;
      pointer-events: none;
      animation: floatGlow 18s infinite alternate-reverse ease-in-out;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(6vmax, 4vmax) scale(1.1); }
    }

    /* =========================================
       CARD CHÍNH (3D TILT EFFECT)
       ========================================= */
    .bio-card {
      position: relative;
      z-index: 10;
      background: rgba(20, 25, 35, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 3rem 1rem 3rem 1rem;
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(120, 180, 255, 0.1) inset;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 620px;
      
      opacity: 0;
      transform: translateY(30px) scale(0.96);
      transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.2, 0.9, 0.3, 1);
      transform-style: preserve-3d;
      overflow: hidden;
    }

    /* Viền gradient phát sáng quanh card */
    .bio-card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(100, 180, 255, 0.5), rgba(157, 78, 221, 0.5), rgba(32, 213, 236, 0.5));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.6;
      z-index: 0;
    }

    /* Hiệu ứng shimmer chạy qua card */
    .bio-card::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.06), transparent);
      transform: skewX(-20deg);
      animation: shimmer 8s infinite;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes shimmer {
      0%, 100% { left: -100%; }
      50% { left: 150%; }
    }

    .bio-card.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Hiệu ứng xuất hiện lần lượt */
    .fade-item {
      position: relative;
      z-index: 2;
      opacity: 0;
      transform: translateY(15px) translateZ(30px);
      transition: all 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .bio-card.show .fade-item {
      opacity: 1;
      transform: translateY(0) translateZ(30px);
    }

    .bio-card.show .avatar-wrapper { transition-delay: 0.1s; }
    .bio-card.show .bio-name { transition-delay: 0.2s; }
    .bio-card.show .bio-tagline { transition-delay: 0.3s; }
    .bio-card.show .bio-stats { transition-delay: 0.35s; }
    .bio-card.show .bio-content { transition-delay: 0.45s; }
    .bio-card.show .social-links { transition-delay: 0.55s; }
    .bio-card.show .music-player { transition-delay: 0.65s; }

    /* Avatar */
    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1.8rem;
    }

    /* Vòng xoay gradient quanh avatar */
    .avatar-wrapper {
      position: relative;
      width: 120px; height: 120px;
      border-radius: 50%;
      padding: 3px;
      margin-bottom: 1rem;
      background: conic-gradient(from 0deg, #3a7bd5, #9d4edd, #20D5EC, #3a7bd5);
      animation: spinRing 6s linear infinite, breathing 3s infinite ease-in-out;
    }

    @keyframes spinRing {
      to { background: conic-gradient(from 360deg, #3a7bd5, #9d4edd, #20D5EC, #3a7bd5); }
    }

    @keyframes breathing {
      0%, 100% { box-shadow: 0 0 15px rgba(100, 180, 255, 0.3); transform: scale(1); }
      50% { box-shadow: 0 0 30px rgba(157, 78, 221, 0.6); transform: scale(1.03); }
    }

    .avatar {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: #1e2433 url('https://cdn.upanhlaylink.com/i/3m20ZXQv.jpeg') center/cover no-repeat;
      background-size: cover; 
      border: 2px solid rgba(255, 255, 255, 0.2);
      position: relative;
    }

    /* Chấm trạng thái online ở avatar */
    .avatar-wrapper::after {
      content: '';
      position: absolute;
      bottom: 6px; right: 6px;
      width: 18px; height: 18px;
      background: #22c55e;
      border: 3px solid #141923;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.8);
      animation: onlinePulse 2s infinite;
    }

    @keyframes onlinePulse {
      0%, 100% { box-shadow: 0 0 6px rgba(34, 197, 94, 0.6); }
      50% { box-shadow: 0 0 14px rgba(34, 197, 94, 1); }
    }

    .bio-name {
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #b0d0ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 2px 10px rgba(100, 180, 255, 0.3);
      margin-bottom: 0.25rem;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.35em;
    }

    /* =========================================
       TICK XANH TIKTOK + TOOLTIP "ĐÃ XÁC MINH"
       ========================================= */
    .verified-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .verified-badge {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 0.75em; height: 0.75em;
      vertical-align: middle;
      filter: drop-shadow(0 0 6px rgba(32, 213, 236, 0.8));
      animation: badgeGlow 2.5s infinite alternate ease-in-out;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .verified-badge::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #4ff0ff 0%, #20D5EC 45%, #0aa5c2 100%);
      box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.15) inset;
    }

    .verified-badge .check-mark {
      position: relative;
      font-size: 0.5em;
      color: #fff;
      z-index: 1;
      font-weight: 900;
      transform: translateY(-0.02em);
      pointer-events: none;
    }

    @keyframes badgeGlow {
      0% { filter: drop-shadow(0 0 4px rgba(32, 213, 236, 0.6)); }
      100% { filter: drop-shadow(0 0 12px rgba(32, 213, 236, 1)); }
    }

    .verified-tooltip {
      position: absolute;
      bottom: calc(100% + 0.5em);
      left: 50%;
      transform: translateX(-50%) translateY(6px);
      background: rgba(10, 15, 25, 0.95);
      color: #e6f7ff;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      padding: 0.4em 0.75em;
      border-radius: 0.5em;
      border: 1px solid rgba(32, 213, 236, 0.5);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), 0 0 10px rgba(32, 213, 236, 0.3);
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
      z-index: 50;
    }

    .verified-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: rgba(10, 15, 25, 0.95);
    }

    .verified-wrapper:hover .verified-tooltip,
    .verified-wrapper.active .verified-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    .bio-tagline {
      color: #8fa5cc;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .bio-tagline i {
      color: #5d9eff;
      font-size: 0.9rem;
    }

    /* =========================================
       BIO STATS (số liệu)
       ========================================= */
    .bio-stats {
      display: flex;
      justify-content: center;
      gap: 1.8rem;
      margin: 1.4rem 0 0.5rem;
      padding: 0.8rem 0;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
      transition: transform 0.25s ease;
    }

    .stat-item:hover {
      transform: translateY(-3px);
    }

    .stat-value {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(to right, #6ea8ff, #b06eff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .stat-label {
      font-size: 0.7rem;
      color: #8fa5cc;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* Thông tin bio */
    .bio-content {
      margin: 1.8rem 0 2rem;
      color: #d0ddf5;
      font-size: 1rem;
      line-height: 1.7;
      text-align: center;
      padding: 0 0.5rem;
    }

    .bio-content p {
      margin-bottom: 0.7rem;
    }

    .bio-content i {
      color: #7aa9ff;
      margin-right: 6px;
      width: 1.2rem;
      text-align: center;
    }

    .bio-quote {
      font-size: 0.95rem;
      opacity: 0.9;
      margin-top: 1rem !important;
      font-style: italic;
      color: #b8c9e6;
      padding: 0.7rem 1rem;
      border-left: 2px solid rgba(110, 168, 255, 0.5);
      border-radius: 0.3rem;
      background: rgba(110, 168, 255, 0.05);
      text-align: left;
    }

    /* Social icons */
    .social-links {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      margin-bottom: 2.2rem;
      flex-wrap: wrap;
    }

    .social-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 3rem; height: 3rem;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.04);
      color: #cddfff;
      font-size: 1.4rem;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
      border: 1px solid rgba(255, 255, 255, 0.06);
      text-decoration: none;
      position: relative;
      overflow: hidden;
    }

    .social-icon::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #3a7bd5, #9d4edd);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: -1;
    }

    .social-icon:hover {
      color: #ffffff;
      transform: translateY(-6px) scale(1.08);
      border-color: transparent;
      box-shadow: 0 12px 22px -8px #2a6bc0;
    }

    .social-icon:hover::before {
      opacity: 1;
    }

    /* =========================================
       MUSIC PLAYER
       ========================================= */
    .music-player {
      background: rgba(15, 20, 30, 0.6);
      border-radius: 1.2rem;
      padding: 0.8rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border: 1px solid rgba(100, 160, 255, 0.15);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      flex-wrap: wrap;
    }

    .music-info {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: #d0e0ff;
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      min-width: 90px;
    }

    /* Đĩa nhạc xoay khi đang phát */
    .music-info i {
      color: #6ea8ff;
      font-size: 1.1rem;
      animation: spinMusic 3s linear infinite paused;
    }

    .music-info.playing i {
      animation-play-state: running;
    }

    @keyframes spinMusic {
      to { transform: rotate(360deg); }
    }

    .progress-wrapper {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex: 1;
      min-width: 140px;
    }

    .time-display {
      font-size: 0.7rem;
      color: #8fa5cc;
      font-variant-numeric: tabular-nums;
      min-width: 32px;
      text-align: center;
    }

    .progress-container {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      transition: height 0.2s ease;
    }

    .progress-container:hover {
      height: 6px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6ea8ff, #b06eff);
      border-radius: 4px;
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
      box-shadow: 0 0 8px rgba(110, 168, 255, 0.6);
    }

    .music-controls {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .music-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.6rem; height: 2.6rem;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.06);
      color: #a0b8d5;
      font-size: 1rem;
    }

    .music-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .music-btn:active {
      transform: scale(0.92);
    }

    #playPauseBtn {
      background: linear-gradient(135deg, #3a7bd5, #9d4edd);
      color: #ffffff;
      border: none;
      animation: beat 1.5s infinite alternate;
    }

    @keyframes beat {
      0% { box-shadow: 0 4px 12px rgba(100, 140, 255, 0.3); }
      100% { box-shadow: 0 4px 25px rgba(157, 78, 221, 0.7); }
    }

    #playPauseBtn:hover {
      box-shadow: 0 6px 16px rgba(100, 140, 255, 0.5);
      animation: none;
    }

    #playPauseBtn i { margin-left: 2px; }
    #playPauseBtn i.fa-pause { margin-left: 0; }

    /* Responsive Mobile */
    @media (max-width: 520px) {
      .bio-card {
        padding: 1.8rem 1.2rem;
        border-radius: 2rem 0.8rem 2rem 0.8rem;
      }
      .bio-name { font-size: 1.7rem; }
      .avatar-wrapper { width: 100px; height: 100px; }
      
      .progress-wrapper {
        order: 3;
        width: 100%;
        margin-top: 0.6rem;
      }
      
      .music-info { flex: 1; }
      .music-controls { margin-left: auto; }

      .verified-tooltip {
        font-size: 0.65rem;
        padding: 0.35em 0.65em;
      }

      .bio-stats { gap: 1.2rem; }
      .stat-value { font-size: 1rem; }
      .stat-label { font-size: 0.6rem; }
    }
  </style>
</head>
<body>

  <!-- MÀN HÌNH CHỜ -->
  <div class="splash-screen" id="splashScreen">
    <div class="splash-text">click to enter...</div>
    <div class="splash-dot"></div>
  </div>

  <!-- Lớp đom đóm bay -->
  <div class="particles" id="particles"></div>

  <!-- Hiệu ứng nền -->
  <div class="glow"></div>
  <div class="glow2"></div>

  <!-- NỘI DUNG CHÍNH -->
  <div class="bio-card" id="bioCard">
    
    <div class="avatar-section fade-item">
      <div class="avatar-wrapper">
        <div class="avatar"></div>
      </div>
      <h1 class="bio-name">
        Lê Trung
        <span class="verified-wrapper" id="verifiedWrapper">
          <span class="verified-badge" aria-label="Đã xác minh">
            <i class="fas fa-check check-mark"></i>
          </span>
          <span class="verified-tooltip">Đã xác minh</span>
        </span>
      </h1>
      <div class="bio-tagline">
        <i class="fas fa-user-graduate"></i> High school student & Developer 
        <i class="fas fa-code"></i>
      </div>
    </div>

    <!-- Số liệu -->
    <div class="bio-stats fade-item">
      <div class="stat-item">
        <span class="stat-value">2+</span>
        <span class="stat-label">Năm code</span>
      </div>
      <div class="stat-item">
        <span class="stat-value">15+</span>
        <span class="stat-label">Dự án</span>
      </div>
      <div class="stat-item">
        <span class="stat-value">∞</span>
        <span class="stat-label">Đam mê</span>
      </div>
    </div>

    <div class="bio-content fade-item">
      <p><i class="fas fa-location-dot"></i> Gia Lai, Việt Nam</p>
      <p class="bio-quote">"Anh vốn dĩ không phải người tốt, chỉ vì yêu em nên anh mới trở thành người tốt"</p>
    </div>

    <div class="social-links fade-item">
      <a href="https://www.facebook.com/share/14vDd2fvqQP/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Facebook">
        <i class="fab fa-facebook-f"></i>
      </a>
      <a href="https://instagram.com/ten-cua-ban" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Instagram">
        <i class="fab fa-instagram"></i>
      </a>
      <a href="https://www.tiktok.com/@tyraeg_?_r=1&_t=ZS-9Ay5f1VKugM" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="TikTok">
        <i class="fab fa-tiktok"></i>
      </a>
      <a href="https://github.com/" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="GitHub">
        <i class="fab fa-github"></i>
      </a>
    </div>

    <div class="music-player fade-item">
      <div class="music-info" id="musicInfo">
        <i class="fas fa-compact-disc"></i>
        <span id="trackName">Kẻ Điên Tin Vào Tình Yêu</span>
      </div>

      <div class="progress-wrapper">
        <span class="time-display" id="currentTime">0:00</span>
        <div class="progress-container" id="progressContainer">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <span class="time-display" id="duration">0:00</span>
      </div>

      <div class="music-controls">
        <button class="music-btn" id="playPauseBtn" aria-label="Play/Pause">
          <i class="fas fa-play" id="playIcon"></i>
        </button>
        <button class="music-btn" id="muteBtn" aria-label="Mute/Unmute">
          <i class="fas fa-volume-up" id="volumeIcon"></i>
        </button>
      </div>
    </div>
  </div>

  <audio id="bgMusic" loop preload="auto" src="https://excellent-coffee-hy1itsie.edgeone.dev/"></audio>

  <script>
    // --- TẠO ĐOM ĐÓM BAY ---
    const particlesContainer = document.getElementById('particles');
    const particleCount = 30;
    for (let i = 0; i < particleCount; i++) {
      const particle = document.createElement('div');
      particle.classList.add('particle');
      const size = Math.random() * 3 + 2;
      particle.style.width = `${size}px`;
      particle.style.height = `${size}px`;
      particle.style.left = `${Math.random() * 100}vw`;
      particle.style.top = `${Math.random() * 100}vh`;
      const duration = Math.random() * 10 + 10;
      particle.style.animationDuration = `${duration}s`;
      particle.style.animationDelay = `${Math.random() * -20}s`;
      particle.style.backgroundColor = Math.random() > 0.5 ? '#6ea8ff' : '#b06eff';
      particlesContainer.appendChild(particle);
    }

    // --- HIỆU ỨNG 3D NGHIÊNG THẺ THEO CHUỘT ---
    const bioCard = document.getElementById('bioCard');
    
    if (window.innerWidth > 768) {
      document.addEventListener('mousemove', (e) => {
        if (!bioCard.classList.contains('show')) return;
        const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
        const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
        bioCard.style.transform = `translateY(0) scale(1) rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        particlesContainer.style.transform = `translate(${xAxis * -1.5}px, ${yAxis * -1.5}px)`;
      });

      document.addEventListener('mouseleave', () => {
        bioCard.style.transform = `translateY(0) scale(1) rotateY(0deg) rotateX(0deg)`;
        particlesContainer.style.transform = `translate(0, 0)`;
      });
    }

    // --- TOOLTIP XÁC MINH ---
    const verifiedWrapper = document.getElementById('verifiedWrapper');
    let tooltipTimer = null;

    function showTooltip() {
      verifiedWrapper.classList.add('active');
      clearTimeout(tooltipTimer);
      tooltipTimer = setTimeout(() => {
        verifiedWrapper.classList.remove('active');
      }, 2000);
    }

    verifiedWrapper.addEventListener('click', (e) => {
      e.stopPropagation();
      showTooltip();
    });

    verifiedWrapper.addEventListener('touchstart', (e) => {
      e.stopPropagation();
      showTooltip();
    }, { passive: true });

    document.addEventListener('click', (e) => {
      if (!verifiedWrapper.contains(e.target)) {
        verifiedWrapper.classList.remove('active');
      }
    });

    document.addEventListener('touchstart', (e) => {
      if (!verifiedWrapper.contains(e.target)) {
        verifiedWrapper.classList.remove('active');
      }
    }, { passive: true });

    // --- LOGIC NHẠC VÀ MÀN HÌNH CHỜ ---
    (function() {
      const audio = document.getElementById('bgMusic');
      const splashScreen = document.getElementById('splashScreen');
      const playPauseBtn = document.getElementById('playPauseBtn');
      const playIcon = document.getElementById('playIcon');
      const muteBtn = document.getElementById('muteBtn');
      const volumeIcon = document.getElementById('volumeIcon');
      const progressBar = document.getElementById('progressBar');
      const progressContainer = document.getElementById('progressContainer');
      const currentTimeEl = document.getElementById('currentTime');
      const durationEl = document.getElementById('duration');
      const musicInfo = document.getElementById('musicInfo');

      audio.volume = 0.7;

      function formatTime(seconds) {
        if (isNaN(seconds) || seconds === Infinity) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      }

      function updatePlayIcon() {
        if (audio.paused) {
          playIcon.classList.remove('fa-pause');
          playIcon.classList.add('fa-play');
          playPauseBtn.style.animation = 'beat 1.5s infinite alternate';
          musicInfo.classList.remove('playing');
        } else {
          playIcon.classList.remove('fa-play');
          playIcon.classList.add('fa-pause');
          playPauseBtn.style.animation = 'none';
          musicInfo.classList.add('playing');
        }
      }

      function updateVolumeIcon() {
        if (audio.muted || audio.volume === 0) {
          volumeIcon.classList.remove('fa-volume-up', 'fa-volume-down');
          volumeIcon.classList.add('fa-volume-mute');
        } else if (audio.volume < 0.5) {
          volumeIcon.classList.remove('fa-volume-up', 'fa-volume-mute');
          volumeIcon.classList.add('fa-volume-down');
        } else {
          volumeIcon.classList.remove('fa-volume-down', 'fa-volume-mute');
          volumeIcon.classList.add('fa-volume-up');
        }
      }

      function updateProgress() {
        if (audio.duration) {
          const percent = (audio.currentTime / audio.duration) * 100;
          progressBar.style.width = percent + '%';
          currentTimeEl.textContent = formatTime(audio.currentTime);
        } else {
          progressBar.style.width = '0%';
          currentTimeEl.textContent = "0:00";
        }
      }

      function togglePlay() {
        if (audio.paused) {
          audio.play().catch(error => console.warn('Lỗi phát nhạc: ', error));
        } else {
          audio.pause();
        }
        updatePlayIcon();
      }

      function toggleMute() {
        audio.muted = !audio.muted;
        updateVolumeIcon();
      }

      splashScreen.addEventListener('click', () => {
        audio.play().catch(err => console.log('Lỗi phát nhạc:', err));
        splashScreen.classList.add('hidden');
        bioCard.classList.add('show');
      });

      progressContainer.addEventListener('click', (e) => {
        const rect = progressContainer.getBoundingClientRect();
        const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        if (audio.duration) audio.currentTime = pos * audio.duration;
      });

      playPauseBtn.addEventListener('click', togglePlay);
      muteBtn.addEventListener('click', toggleMute);

      audio.addEventListener('play', () => { updatePlayIcon(); updateVolumeIcon(); });
      audio.addEventListener('pause', () => { updatePlayIcon(); });
      audio.addEventListener('volumechange', updateVolumeIcon);
      audio.addEventListener('timeupdate', updateProgress);

      audio.addEventListener('loadedmetadata', () => {
        durationEl.textContent = formatTime(audio.duration);
        updateProgress();
        updateVolumeIcon();
        updatePlayIcon();
      });

      audio.addEventListener('error', (e) => {
        console.warn('Lỗi âm thanh:', e);
        document.getElementById('trackName').textContent = 'Không tải được nhạc';
        progressBar.style.width = '0%';
        currentTimeEl.textContent = "0:00";
        durationEl.textContent = "0:00";
      });

      audio.addEventListener('canplay', () => {
        updatePlayIcon();
        updateVolumeIcon();
        if (audio.duration) {
          durationEl.textContent = formatTime(audio.duration);
          updateProgress();
        }
      });
    })();
  </script>
</body>
</html>
