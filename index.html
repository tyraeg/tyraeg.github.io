<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio • PawDev</title>
  <!-- Font Awesome icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #0b0f1a 0%, #1a1f2e 100%);
      padding: 1rem;
    }

    /* Hiệu ứng ánh sáng nền */
    .glow {
      position: fixed;
      width: 60vmax;
      height: 60vmax;
      background: radial-gradient(circle, rgba(100, 210, 255, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      top: -20vmax;
      left: -20vmax;
      z-index: 0;
      pointer-events: none;
      animation: floatGlow 14s infinite alternate ease-in-out;
    }

    .glow2 {
      position: fixed;
      width: 70vmax;
      height: 70vmax;
      background: radial-gradient(circle, rgba(200, 100, 255, 0.12) 0%, transparent 70%);
      border-radius: 50%;
      bottom: -30vmax;
      right: -20vmax;
      z-index: 0;
      pointer-events: none;
      animation: floatGlow 18s infinite alternate-reverse ease-in-out;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(6vmax, 4vmax) scale(1.1); }
    }

    /* Card chính */
    .bio-card {
      position: relative;
      z-index: 10;
      background: rgba(20, 25, 35, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 3rem 1rem 3rem 1rem;
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(120, 180, 255, 0.1) inset;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 620px;
      transition: all 0.3s ease;
      animation: cardAppear 0.9s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    @keyframes cardAppear {
      0% { opacity: 0; transform: translateY(30px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .bio-card:hover {
      border-color: rgba(150, 200, 255, 0.25);
      box-shadow: 0 30px 55px -12px #000000cc, 0 0 0 1px rgba(120, 200, 255, 0.25) inset;
    }

    /* Avatar */
    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1.8rem;
    }

    .avatar-wrapper {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3a7bd5, #9d4edd);
      padding: 3px;
      margin-bottom: 1rem;
      box-shadow: 0 0 25px rgba(100, 180, 255, 0.4);
      transition: transform 0.3s ease;
    }

    .avatar-wrapper:hover {
      transform: scale(1.02);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #1e2433 url('https://cdn.upanhlaylink.com/i/3m20ZXQv.jpeg') center/cover no-repeat;
      background-size: cover; 
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .bio-name {
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #b0d0ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 2px 10px rgba(100, 180, 255, 0.3);
      margin-bottom: 0.25rem;
      text-align: center;
    }

    .bio-tagline {
      color: #8fa5cc;
      font-size: 1rem;
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .bio-tagline i {
      color: #5d9eff;
      font-size: 0.9rem;
    }

    /* Thông tin bio */
    .bio-content {
      margin: 1.8rem 0 2rem;
      color: #d0ddf5;
      font-size: 1rem;
      line-height: 1.7;
      text-align: center;
      padding: 0 0.5rem;
    }

    .bio-content p {
      margin-bottom: 0.7rem;
    }

    .bio-content i {
      color: #7aa9ff;
      margin-right: 6px;
      width: 1.2rem;
      text-align: center;
    }

    .highlight {
      color: #fff;
      font-weight: 600;
      background: linear-gradient(120deg, #1e3a5f, transparent);
      padding: 0.1rem 0.4rem;
      border-radius: 6px;
      display: inline-block;
    }

    /* Social icons */
    .social-links {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      margin-bottom: 2.2rem;
      flex-wrap: wrap;
    }

    .social-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 3rem;
      height: 3rem;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.04);
      color: #cddfff;
      font-size: 1.4rem;
      transition: all 0.25s ease;
      border: 1px solid rgba(255, 255, 255, 0.06);
      text-decoration: none;
    }

    .social-icon:hover {
      background: #2a3b5a;
      color: #ffffff;
      transform: translateY(-4px);
      border-color: #5d9eff;
      box-shadow: 0 12px 18px -8px #2a6bc0;
    }

    /* Music player */
    .music-player {
      background: rgba(10, 15, 25, 0.7);
      border-radius: 3rem;
      padding: 0.6rem 0.6rem 0.6rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      border: 1px solid rgba(100, 160, 255, 0.25);
      box-shadow: 0 8px 20px -10px #000000, 0 0 0 1px rgba(80, 140, 255, 0.2) inset;
      backdrop-filter: blur(8px);
      transition: border-color 0.3s;
      flex-wrap: wrap;
      justify-content: center;
    }

    .music-player:hover {
      border-color: rgba(130, 190, 255, 0.55);
    }

    .music-info {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: #b8ceff;
      font-size: 0.95rem;
      font-weight: 500;
      white-space: nowrap;
    }

    .music-info i {
      color: #5d9eff;
      font-size: 1.2rem;
      animation: pulseNote 1.8s infinite;
    }

    @keyframes pulseNote {
      0% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0.8; transform: scale(1); }
    }

    /* Khối thanh tiến trình + thời gian */
    .progress-wrapper {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 1 1 150px;
    }

    .time-display {
      font-size: 0.75rem;
      color: #8fa5cc;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* Thanh tiến trình mini */
    .progress-container {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4f9eff, #b06eff);
      border-radius: 10px;
      transition: width 0.1s linear;
    }

    .music-controls {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .music-btn {
      background: rgba(255, 255, 255, 0.06);
      border: none;
      color: #d0e0ff;
      width: 2.6rem;
      height: 2.6rem;
      border-radius: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .music-btn:hover {
      background: #2a4b7a;
      color: white;
      border-color: #6ea8ff;
    }

    .music-btn:active {
      transform: scale(0.94);
    }

    /* Lưu ý nhỏ */
    .music-note {
      font-size: 0.7rem;
      color: #6a7fa0;
      text-align: center;
      margin-top: 1rem;
      letter-spacing: 0.5px;
    }

    /* Responsive */
    @media (max-width: 520px) {
      .bio-card {
        padding: 1.8rem 1.2rem;
        border-radius: 2rem 0.8rem 2rem 0.8rem;
      }
      .bio-name {
        font-size: 1.7rem;
      }
      .avatar-wrapper {
        width: 100px;
        height: 100px;
      }
      .music-player {
        padding: 0.8rem 1rem;
        gap: 0.6rem;
      }
      .music-info {
        font-size: 0.85rem;
        gap: 0.4rem;
      }
      .music-btn {
        width: 2.4rem;
        height: 2.4rem;
        font-size: 1rem;
      }
      .progress-wrapper {
        order: 3;
        width: 100%;
        flex: 1 1 100%;
        margin-top: 0.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Hiệu ứng nền -->
  <div class="glow"></div>
  <div class="glow2"></div>

  <div class="bio-card">
    <!-- Avatar + Tên -->
    <div class="avatar-section">
      <div class="avatar-wrapper">
        <div class="avatar"></div>
      </div>
      <h1 class="bio-name">Lê Trung</h1>
      <div class="bio-tagline">
        <i class="fas fa-user-graduate"></i> High school student & Developer 
        <i class="fas fa-code"></i>
      </div>
    </div>

    <!-- Nội dung bio -->
    <div class="bio-content">
      <p><i class="fas fa-location-dot"></i> Gia Lai, Việt Nam</p>
      <p style="font-size:0.95rem; opacity:0.9; margin-top:1rem;">"Anh vốn dĩ không phải người tốt, chỉ vì yêu em nên anh mới trở thành người tốt"</p>
    </div>

    <!-- Social -->
    <div class="social-links">
      <a href="https://www.facebook.com/share/14vDd2fvqQP/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Facebook">
        <i class="fab fa-facebook-f"></i>
      </a>
      <a href="https://instagram.com/ten-cua-ban" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Instagram">
        <i class="fab fa-instagram"></i>
      </a>
      <a href="https://www.tiktok.com/@tyraeg_?_r=1&_t=ZS-9Ay5f1VKugM" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="TikTok">
        <i class="fab fa-tiktok"></i>
      </a>
    </div>

    <!-- Music player -->
    <div class="music-player">
      <div class="music-info">
        <i class="fas fa-music"></i>
        <span id="trackName">InLove</span>
      </div>

      <!-- Thanh tiến trình + Thời gian -->
      <div class="progress-wrapper">
        <span class="time-display" id="currentTime">0:00</span>
        <div class="progress-container" id="progressContainer">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <span class="time-display" id="duration">0:00</span>
      </div>

      <div class="music-controls">
        <button class="music-btn" id="playPauseBtn" aria-label="Play/Pause">
          <i class="fas fa-play" id="playIcon"></i>
        </button>
        <button class="music-btn" id="muteBtn" aria-label="Mute/Unmute">
          <i class="fas fa-volume-up" id="volumeIcon"></i>
        </button>
      </div>
    </div>
    <div class="music-note">
      <i class="fas fa-circle-info"></i> Nhấn vào bất kỳ đâu trên trang để bật nhạc nếu trình duyệt chặn
    </div>
  </div>

  <!-- Audio element -->
  <audio id="bgMusic" loop preload="auto" src="https://wily-silver-gwxkcolc.edgeone.dev/"></audio>

  <script>
    (function() {
      const audio = document.getElementById('bgMusic');
      const playPauseBtn = document.getElementById('playPauseBtn');
      const playIcon = document.getElementById('playIcon');
      const muteBtn = document.getElementById('muteBtn');
      const volumeIcon = document.getElementById('volumeIcon');
      const progressBar = document.getElementById('progressBar');
      const progressContainer = document.getElementById('progressContainer');
      const trackName = document.getElementById('trackName');
      const currentTimeEl = document.getElementById('currentTime');
      const durationEl = document.getElementById('duration');

      audio.volume = 0.7;

      function formatTime(seconds) {
        if (isNaN(seconds) || seconds === Infinity) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      }

      function updatePlayIcon() {
        if (audio.paused) {
          playIcon.classList.remove('fa-pause');
          playIcon.classList.add('fa-play');
        } else {
          playIcon.classList.remove('fa-play');
          playIcon.classList.add('fa-pause');
        }
      }

      function updateVolumeIcon() {
        if (audio.muted || audio.volume === 0) {
          volumeIcon.classList.remove('fa-volume-up', 'fa-volume-down');
          volumeIcon.classList.add('fa-volume-mute');
        } else if (audio.volume < 0.5) {
          volumeIcon.classList.remove('fa-volume-up', 'fa-volume-mute');
          volumeIcon.classList.add('fa-volume-down');
        } else {
          volumeIcon.classList.remove('fa-volume-down', 'fa-volume-mute');
          volumeIcon.classList.add('fa-volume-up');
        }
      }

      function updateProgress() {
        if (audio.duration) {
          const percent = (audio.currentTime / audio.duration) * 100;
          progressBar.style.width = percent + '%';
          currentTimeEl.textContent = formatTime(audio.currentTime);
        } else {
          progressBar.style.width = '0%';
          currentTimeEl.textContent = "0:00";
        }
      }

      function togglePlay() {
        if (audio.paused) {
          audio.play().catch(error => {
            console.warn('Không thể phát: ', error);
            playIcon.classList.remove('fa-pause');
            playIcon.classList.add('fa-play');
          });
        } else {
          audio.pause();
        }
        updatePlayIcon();
      }

      function toggleMute() {
        audio.muted = !audio.muted;
        updateVolumeIcon();
      }

      progressContainer.addEventListener('click', (e) => {
        const rect = progressContainer.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        if (audio.duration) {
          audio.currentTime = pos * audio.duration;
        }
      });

      playPauseBtn.addEventListener('click', togglePlay);
      muteBtn.addEventListener('click', toggleMute);

      audio.addEventListener('play', () => { updatePlayIcon(); updateVolumeIcon(); });
      audio.addEventListener('pause', () => { updatePlayIcon(); });
      audio.addEventListener('volumechange', updateVolumeIcon);
      audio.addEventListener('timeupdate', updateProgress);

      audio.addEventListener('loadedmetadata', () => {
        durationEl.textContent = formatTime(audio.duration);
        updateProgress();
        updateVolumeIcon();
        updatePlayIcon();
      });

      // BẮT SỰ KIỆN CLICK ĐỂ TỰ ĐỘNG PHÁT NHẠC
      function tryAutoplay() {
        if (audio.paused) {
          audio.play().then(() => {
            // Phát thành công thì xoá các sự kiện lắng nghe
            document.removeEventListener('click', tryAutoplay);
            document.removeEventListener('touchstart', tryAutoplay);
            document.removeEventListener('scroll', tryAutoplay);
            document.removeEventListener('keydown', tryAutoplay);
          }).catch(err => {
            // Vẫn bị chặn
          });
        }
      }

      document.addEventListener('click', tryAutoplay);
      document.addEventListener('touchstart', tryAutoplay);
      document.addEventListener('scroll', tryAutoplay);
      document.addEventListener('keydown', tryAutoplay);

      // Thử tự phát ngay khi tải trang
      window.addEventListener('load', () => {
        audio.play().then(() => {
           document.removeEventListener('click', tryAutoplay);
           document.removeEventListener('touchstart', tryAutoplay);
           document.removeEventListener('scroll', tryAutoplay);
           document.removeEventListener('keydown', tryAutoplay);
        }).catch(err => {
          console.log('Trình duyệt chặn tự phát. Đang chờ người dùng click...');
          updatePlayIcon(); 
        });
        updateVolumeIcon();
      });

      audio.addEventListener('error', (e) => {
        console.warn('Lỗi âm thanh:', e);
        trackName.textContent = 'Không tải được nhạc';
        progressBar.style.width = '0%';
        currentTimeEl.textContent = "0:00";
        durationEl.textContent = "0:00";
      });

      audio.addEventListener('canplay', () => {
        updatePlayIcon();
        updateVolumeIcon();
        if (audio.duration) {
          durationEl.textContent = formatTime(audio.duration);
          updateProgress();
        }
      });
    })();
  </script>
</body>
</html>
