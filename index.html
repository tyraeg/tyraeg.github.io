<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio • PawDev</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#3a7bd5">
  <link rel="apple-touch-icon" href="https://cdn.upanhlaylink.com/i/3m20ZXQv.jpeg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <style>
    /* =========================================
       THEME VARIABLES & GLOBAL
       ========================================= */
    :root {
      --bg1: #0b0f1a;
      --bg2: #1a1f2e;
      --card-bg: rgba(20, 25, 35, 0.75);
      --text-main: #ffffff;
      --text-sub: #8fa5cc;
      --text-body: #d0ddf5;
      --accent1: #3a7bd5;
      --accent2: #9d4edd;
      --accent3: #20D5EC;
      --accent-text: linear-gradient(to right, #ffffff, #b0d0ff);
      --border-color: rgba(255, 255, 255, 0.08);
      --social-bg: rgba(255, 255, 255, 0.04);
      --social-hover: #2a3b5a;
      --tooltip-bg: rgba(10, 15, 25, 0.95);
      --shadow-color: rgba(0, 0, 0, 0.8);
      --glow-1: rgba(100, 210, 255, 0.15);
      --glow-2: rgba(200, 100, 255, 0.12);
    }

    body.light-mode {
      --bg1: #e0e5ec;
      --bg2: #f0f4f8;
      --card-bg: rgba(255, 255, 255, 0.85);
      --text-main: #1a1f2e;
      --text-sub: #4a5b7a;
      --text-body: #2c3e50;
      --accent1: #2563eb;
      --accent2: #7c3aed;
      --accent3: #0891b2;
      --accent-text: linear-gradient(to right, #1a1f2e, #2563eb);
      --border-color: rgba(0, 0, 0, 0.08);
      --social-bg: rgba(0, 0, 0, 0.04);
      --social-hover: #d1d9e6;
      --tooltip-bg: rgba(255, 255, 255, 0.95);
      --shadow-color: rgba(0, 0, 0, 0.15);
      --glow-1: rgba(37, 99, 235, 0.1);
      --glow-2: rgba(124, 58, 237, 0.08);
    }

    body.theme-blue { --accent1: #2563eb; --accent2: #06b6d4; --accent3: #3b82f6; }
    body.theme-purple { --accent1: #8b5cf6; --accent2: #d946ef; --accent3: #a855f7; }
    body.theme-green { --accent1: #10b981; --accent2: #34d399; --accent3: #059669; }
    body.theme-orange { --accent1: #f59e0b; --accent2: #f97316; --accent3: #fbbf24; }
    body.theme-pink { --accent1: #ec4899; --accent2: #f472b6; --accent3: #db2777; }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, var(--bg1) 0%, var(--bg2) 100%);
      padding: 2rem 1rem;
      overflow-x: hidden;
      perspective: 1000px;
      position: relative;
      cursor: crosshair;
    }

    /* =========================================
       THEME & MODE SWITCHER
       ========================================= */
    .top-controls {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      display: flex;
      gap: 0.8rem;
      z-index: 1000;
    }

    .control-btn {
      width: 2.8rem;
      height: 2.8rem;
      border-radius: 50%;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      box-shadow: 0 4px 15px var(--shadow-color);
      transition: all 0.3s ease;
      pointer-events: auto;
    }

    .control-btn:hover {
      transform: scale(1.1) rotate(10deg);
      color: var(--accent1);
      border-color: var(--accent1);
    }

    .theme-palette {
      position: absolute;
      top: 3.5rem;
      right: 0;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      padding: 0.6rem;
      border-radius: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      box-shadow: 0 10px 25px var(--shadow-color);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      pointer-events: auto;
    }

    .theme-palette.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .color-dot {
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s;
    }
    .color-dot:hover { transform: scale(1.2); }
    .color-dot[data-theme="theme-blue"] { background: linear-gradient(135deg, #2563eb, #06b6d4); }
    .color-dot[data-theme="theme-purple"] { background: linear-gradient(135deg, #8b5cf6, #d946ef); }
    .color-dot[data-theme="theme-green"] { background: linear-gradient(135deg, #10b981, #34d399); }
    .color-dot[data-theme="theme-orange"] { background: linear-gradient(135deg, #f59e0b, #f97316); }
    .color-dot[data-theme="theme-pink"] { background: linear-gradient(135deg, #ec4899, #f472b6); }

    /* =========================================
       SPLASH SCREEN
       ========================================= */
    .splash-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: linear-gradient(145deg, var(--bg1) 0%, var(--bg2) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .splash-screen.hidden { opacity: 0; visibility: hidden; }

    .splash-screen::before {
      content: '';
      position: absolute;
      width: 50vmax; height: 50vmax;
      background: radial-gradient(circle, var(--glow-1) 0%, transparent 60%);
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: -1;
    }

    .splash-text {
      color: var(--text-main);
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 15px;
      opacity: 0;
      transform: translateY(20px) scale(0.9);
      animation: smoothAppear 1.2s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
      text-shadow: 0 0 20px rgba(100, 180, 255, 0.5);
    }

    .splash-dot {
      margin-top: 40px;
      width: 8px; height: 8px;
      background-color: var(--accent1);
      border-radius: 50%;
      animation: pulseDot 1.5s infinite;
    }

    @keyframes smoothAppear { to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes pulseDot {
      0% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 0 0 var(--accent1); }
      70% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 10px transparent; }
      100% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 0 0 transparent; }
    }

    /* =========================================
       PARTICLES & GLOW
       ========================================= */
    .particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      opacity: 0;
      filter: blur(1px);
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
      10% { opacity: 0.4; }
      90% { opacity: 0.4; }
      100% { transform: translateY(-100vh) translateX(20px) scale(1.5); opacity: 0; }
    }

    .glow {
      position: fixed;
      width: 60vmax; height: 60vmax;
      background: radial-gradient(circle, var(--glow-1) 0%, transparent 70%);
      border-radius: 50%;
      top: -20vmax; left: -20vmax;
      z-index: 0;
      pointer-events: none;
      animation: floatGlow 14s infinite alternate ease-in-out;
    }

    .glow2 {
      position: fixed;
      width: 70vmax; height: 70vmax;
      background: radial-gradient(circle, var(--glow-2) 0%, transparent 70%);
      border-radius: 50%;
      bottom: -30vmax; right: -20vmax;
      z-index: 0;
      pointer-events: none;
      animation: floatGlow 18s infinite alternate-reverse ease-in-out;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(6vmax, 4vmax) scale(1.1); }
    }

    /* =========================================
       BIO CARD
       ========================================= */
    .bio-card {
      position: relative;
      z-index: 10;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 3rem 1rem 3rem 1rem;
      box-shadow: 0 25px 45px -12px var(--shadow-color), 0 0 0 1px rgba(120, 180, 255, 0.1) inset;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 620px;
      opacity: 0;
      transform: translateY(30px) scale(0.96);
      transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.2, 0.9, 0.3, 1);
      transform-style: preserve-3d;
      overflow: hidden;
    }

    .bio-card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, var(--accent1), var(--accent2), var(--accent3));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.5;
      z-index: 0;
      transition: opacity 0.3s;
    }

    .bio-card:hover::before { opacity: 1; }
    .bio-card.show { opacity: 1; transform: translateY(0) scale(1); }

    /* =========================================
       PAW CLICK
       ========================================= */
    .paw-click {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      width: 40px;
      height: 40px;
      transform: translate(-50%, -50%) scale(1) rotate(0deg);
      animation: pawPop 1s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
      filter: drop-shadow(0 0 8px var(--accent3));
      user-select: none;
    }

    @keyframes pawPop {
      0% {
        transform: translate(-50%, -50%) scale(0.3) rotate(0deg);
        opacity: 1;
        filter: drop-shadow(0 0 2px var(--accent3));
      }
      30% {
        transform: translate(-50%, -50%) scale(1.2) rotate(var(--rot));
        opacity: 1;
        filter: drop-shadow(0 0 15px var(--accent3));
      }
      100% {
        transform: translate(-50%, -50%) scale(1.6) rotate(var(--rot));
        opacity: 0;
        filter: drop-shadow(0 0 0 transparent);
      }
    }

    .fade-item {
      position: relative;
      z-index: 2;
      opacity: 0;
      transform: translateY(15px) translateZ(30px);
      transition: all 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .bio-card.show .fade-item {
      opacity: 1;
      transform: translateY(0) translateZ(30px);
    }

    .bio-card.show .avatar-wrapper { transition-delay: 0.1s; }
    .bio-card.show .bio-name { transition-delay: 0.2s; }
    .bio-card.show .bio-tagline { transition-delay: 0.3s; }
    .bio-card.show .bio-content { transition-delay: 0.45s; }
    .bio-card.show .social-links { transition-delay: 0.55s; }
    .bio-card.show .music-player { transition-delay: 0.7s; }

    /* Avatar */
    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .avatar-wrapper {
      position: relative;
      width: 120px; height: 120px;
      border-radius: 50%;
      padding: 3px;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      animation: breathing 3s infinite ease-in-out;
    }

    @keyframes breathing {
      0%, 100% { box-shadow: 0 0 15px var(--glow-1); transform: scale(1); }
      50% { box-shadow: 0 0 30px var(--glow-2); transform: scale(1.03); }
    }

    .avatar {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: var(--bg1) url('https://cdn.upanhlaylink.com/i/3m20ZXQv.jpeg') center/cover no-repeat;
      background-size: cover;
      border: 2px solid rgba(255, 255, 255, 0.2);
      position: relative;
    }

    .avatar-wrapper::after {
      content: '';
      position: absolute;
      bottom: 6px; right: 6px;
      width: 18px; height: 18px;
      background: #22c55e;
      border: 3px solid var(--bg1);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.8);
      animation: onlinePulse 2s infinite;
    }

    /* Avatar theo mùa - emoji override ::after */
    .avatar-wrapper.season-tet::after,
    .avatar-wrapper.season-christmas::after,
    .avatar-wrapper.season-halloween::after,
    .avatar-wrapper.season-newyear::after {
      width: auto; height: auto;
      background: transparent;
      border: none;
      box-shadow: none;
      font-size: 1.4rem;
      bottom: auto; right: -8px; top: -8px;
      animation: floatEmoji 3s ease-in-out infinite;
      border-radius: 0;
    }
    .avatar-wrapper.season-tet::after { content: '🌸'; }
    .avatar-wrapper.season-christmas::after { content: '🎄'; }
    .avatar-wrapper.season-halloween::after { content: '🎃'; }
    .avatar-wrapper.season-newyear::after { content: '🎆'; }

    @keyframes floatEmoji {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-6px) rotate(5deg); }
    }

    @keyframes onlinePulse {
      0%, 100% { box-shadow: 0 0 6px rgba(34, 197, 94, 0.6); }
      50% { box-shadow: 0 0 14px rgba(34, 197, 94, 1); }
    }

    .bio-name {
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: var(--accent-text);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 2px 10px var(--glow-1);
      margin-bottom: 0.25rem;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.35em;
    }

    .verified-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .verified-badge {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 0.75em; height: 0.75em;
      vertical-align: middle;
      filter: drop-shadow(0 0 6px rgba(32, 213, 236, 0.8));
      animation: badgeGlow 2.5s infinite alternate ease-in-out;
      cursor: pointer;
    }

    .verified-badge::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #4ff0ff 0%, #20D5EC 45%, #0aa5c2 100%);
      box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.15) inset;
    }

    .verified-badge .check-mark {
      position: relative;
      font-size: 0.5em;
      color: #fff;
      z-index: 1;
      font-weight: 900;
      transform: translateY(-0.02em);
      pointer-events: none;
    }

    @keyframes badgeGlow {
      0% { filter: drop-shadow(0 0 4px rgba(32, 213, 236, 0.6)); }
      100% { filter: drop-shadow(0 0 12px rgba(32, 213, 236, 1)); }
    }

    .verified-tooltip {
      position: absolute;
      bottom: calc(100% + 0.5em);
      left: 50%;
      transform: translateX(-50%) translateY(6px);
      background: var(--tooltip-bg);
      color: var(--text-main);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      padding: 0.4em 0.75em;
      border-radius: 0.5em;
      border: 1px solid var(--accent3);
      box-shadow: 0 4px 14px var(--shadow-color), 0 0 10px rgba(32, 213, 236, 0.3);
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 50;
    }

    .verified-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: var(--tooltip-bg);
    }

    .verified-wrapper:hover .verified-tooltip,
    .verified-wrapper.active .verified-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    .bio-tagline {
      color: var(--text-sub);
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      justify-content: center;
      flex-wrap: wrap;
      min-height: 1.5rem;
    }

    .bio-tagline i { color: var(--accent1); font-size: 0.9rem; }

    .typewriter { display: inline-block; }

    .bio-content {
      margin: 1.2rem 0;
      color: var(--text-body);
      font-size: 1rem;
      line-height: 1.7;
      text-align: center;
      padding: 0 0.5rem;
    }

    .bio-content p { margin-bottom: 0.7rem; }
    .bio-content i { color: var(--accent1); margin-right: 6px; width: 1.2rem; text-align: center; }

    .bio-quote {
      font-size: 0.95rem;
      opacity: 0.9;
      margin-top: 1rem !important;
      font-style: italic;
      color: var(--text-sub);
      padding: 0.7rem 1rem;
      border-left: 2px solid var(--accent1);
      border-radius: 0.3rem;
      background: var(--social-bg);
      text-align: left;
    }

    /* Live clock + view counter */
    .live-info, .view-counter {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      font-size: 0.92rem;
      color: var(--text-body);
      flex-wrap: wrap;
    }

    .live-info #liveClock {
      font-family: 'Courier New', monospace;
      font-weight: 700;
      color: var(--accent1);
      letter-spacing: 1px;
    }

    .timezone-tag {
      font-size: 0.65rem;
      padding: 0.1em 0.4em;
      background: var(--social-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.3em;
      color: var(--text-sub);
    }

    .view-counter { font-size: 0.85rem; opacity: 0.85; }
    .view-counter #viewCount { font-weight: 700; color: var(--accent3); }

    /* Social icons */
    .social-links {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .social-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.8rem; height: 2.8rem;
      border-radius: 1rem;
      background: var(--social-bg);
      color: var(--text-main);
      font-size: 1.3rem;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
      border: 1px solid var(--border-color);
      text-decoration: none;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      font-family: inherit;
    }

    .social-icon::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: -1;
    }

    .social-icon:hover {
      color: #ffffff;
      transform: translateY(-5px) scale(1.05);
      border-color: transparent;
      box-shadow: 0 12px 22px -8px var(--accent1);
    }

    .social-icon:hover::before { opacity: 1; }

    /* =========================================
       MUSIC PLAYER
       ========================================= */
    .music-player {
      background: var(--social-bg);
      border-radius: 1.2rem;
      padding: 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px -10px var(--shadow-color);
      backdrop-filter: blur(16px);
      position: relative;
    }

    .music-info {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--text-main);
      font-size: 0.9rem;
      font-weight: 600;
      flex: 1 1 auto;
      min-width: 140px;
    }

    .music-info i {
      color: var(--accent1);
      font-size: 1.1rem;
      animation: spinMusic 3s linear infinite paused;
      flex-shrink: 0;
    }

    .music-info.playing i { animation-play-state: running; }
    @keyframes spinMusic { to { transform: rotate(360deg); } }

    #trackName {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .music-controls {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-shrink: 0;
    }

    .music-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.4rem; height: 2.4rem;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      background: var(--social-bg);
      color: var(--text-main);
      font-size: 1rem;
      flex-shrink: 0;
    }

    .music-btn:hover { background: var(--social-hover); transform: scale(1.05); }
    .music-btn:active { transform: scale(0.92); }

    #playPauseBtn {
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      color: #ffffff;
      border: none;
      animation: beat 1.5s infinite alternate;
    }

    @keyframes beat {
      0% { box-shadow: 0 4px 12px var(--glow-1); }
      100% { box-shadow: 0 4px 25px var(--glow-2); }
    }

    #playPauseBtn:hover { box-shadow: 0 6px 16px var(--glow-1); animation: none; }
    #playPauseBtn i { margin-left: 2px; }
    #playPauseBtn i.fa-pause { margin-left: 0; }

    .progress-wrapper {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex: 1 1 100%;
      order: 3;
    }

    .time-display {
      font-size: 0.7rem;
      color: var(--text-sub);
      font-variant-numeric: tabular-nums;
      min-width: 32px;
      text-align: center;
      flex-shrink: 0;
    }

    .progress-container {
      flex: 1;
      height: 4px;
      background: rgba(128, 128, 128, 0.2);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      transition: height 0.2s ease;
    }

    .progress-container:hover { height: 6px; }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      border-radius: 4px;
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
      box-shadow: 0 0 8px var(--glow-1);
    }

    .visualizer-container {
      width: 100%;
      height: 25px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 3px;
      order: 4;
      opacity: 0.8;
    }

    .vis-bar {
      width: 4px;
      height: 5%;
      background: linear-gradient(to top, var(--accent1), var(--accent3));
      border-radius: 2px;
      transition: height 0.1s ease;
    }

    @media (min-width: 521px) {
      .music-info { flex: 0 1 auto; }
      .progress-wrapper { flex: 1 1 auto; order: 0; min-width: 100px; }
      .visualizer-container { order: 0; width: 60px; flex-shrink: 0; }
    }

    /* =========================================
       PLAYLIST PANEL
       ========================================= */
    .playlist-panel {
      position: absolute;
      bottom: calc(100% + 0.5rem);
      left: 0;
      right: 0;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      box-shadow: 0 10px 30px var(--shadow-color);
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
      z-index: 20;
    }

    .playlist-panel.active {
      max-height: 320px;
      opacity: 1;
      overflow-y: auto;
    }

    .playlist-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem 1rem;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-main);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      background: var(--card-bg);
      z-index: 2;
    }

    .playlist-close {
      background: transparent;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      font-size: 1rem;
      padding: 0.2rem;
    }

    .playlist-list {
      list-style: none;
      padding: 0.4rem;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 0.8rem;
      border-radius: 0.6rem;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-body);
      transition: background 0.2s;
    }

    .playlist-item:hover { background: var(--social-hover); }

    .playlist-item.active {
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      color: #fff;
      font-weight: 600;
    }

    .playlist-item .track-index {
      font-size: 0.75rem;
      opacity: 0.7;
      min-width: 1.2rem;
      text-align: center;
    }

    /* =========================================
       QR MODAL
       ========================================= */
    .qr-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      padding: 1rem;
    }

    .qr-modal.active { opacity: 1; visibility: visible; }

    .qr-modal-content {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 1.5rem;
      padding: 2rem 1.5rem 1.5rem;
      max-width: 340px;
      width: 100%;
      text-align: center;
      position: relative;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .qr-modal.active .qr-modal-content { transform: scale(1); }

    .qr-modal-close {
      position: absolute;
      top: 0.8rem;
      right: 0.8rem;
      background: var(--social-bg);
      border: 1px solid var(--border-color);
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      color: var(--text-main);
      cursor: pointer;
      font-size: 0.9rem;
    }

    .qr-modal-content h3 {
      color: var(--text-main);
      margin-bottom: 1rem;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .qr-modal-content h3 i { color: var(--accent1); }

    #qrcodeContainer {
      display: inline-block;
      padding: 0.8rem;
      background: #fff;
      border-radius: 1rem;
      margin: 0.5rem auto 1rem;
    }

    #qrcodeContainer img, #qrcodeContainer canvas { display: block; }

    .qr-url {
      font-size: 0.75rem;
      color: var(--text-sub);
      word-break: break-all;
      margin-bottom: 1rem;
      padding: 0 0.5rem;
    }

    .qr-copy-btn {
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      color: #fff;
      border: none;
      padding: 0.6rem 1.4rem;
      border-radius: 0.7rem;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .qr-copy-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px var(--glow-1);
    }

    /* Responsive Mobile */
    @media (max-width: 520px) {
      .bio-card { padding: 1.8rem 1.2rem; border-radius: 2rem 0.8rem 2rem 0.8rem; }
      .bio-name { font-size: 1.7rem; }
      .avatar-wrapper { width: 100px; height: 100px; }
      .top-controls { top: 1rem; right: 1rem; gap: 0.5rem; }
      .control-btn { width: 2.4rem; height: 2.4rem; font-size: 1rem; }
      .verified-tooltip { font-size: 0.65rem; padding: 0.35em 0.65em; }
      .paw-click { width: 30px; height: 30px; }
      .playlist-panel { max-height: 260px; }
      .qr-modal-content { padding: 1.5rem 1rem 1rem; }
    }
  </style>
</head>
<body>

  <!-- ĐIỀU KHIỂN THEME & MODE -->
  <div class="top-controls">
    <button class="control-btn" id="themeToggleBtn" aria-label="Đổi màu chủ đề">
      <i class="fas fa-palette"></i>
    </button>
    <div class="theme-palette" id="themePalette">
      <div class="color-dot" data-theme="theme-blue" title="Xanh dương"></div>
      <div class="color-dot" data-theme="theme-purple" title="Tím"></div>
      <div class="color-dot" data-theme="theme-green" title="Xanh lá"></div>
      <div class="color-dot" data-theme="theme-orange" title="Cam"></div>
      <div class="color-dot" data-theme="theme-pink" title="Hồng"></div>
    </div>
    <button class="control-btn" id="modeToggleBtn" aria-label="Đổi chế độ Sáng/Tối">
      <i class="fas fa-moon" id="modeIcon"></i>
    </button>
  </div>

  <!-- SPLASH -->
  <div class="splash-screen" id="splashScreen">
    <div class="splash-text">click to enter...</div>
    <div class="splash-dot"></div>
  </div>

  <div class="particles" id="particles"></div>
  <div class="glow"></div>
  <div class="glow2"></div>

  <!-- CARD -->
  <div class="bio-card" id="bioCard">
    <div class="avatar-section fade-item">
      <div class="avatar-wrapper" id="avatarWrapper">
        <div class="avatar"></div>
      </div>
      <h1 class="bio-name">
        Lê Trung
        <span class="verified-wrapper" id="verifiedWrapper">
          <span class="verified-badge" aria-label="Đã xác minh">
            <i class="fas fa-check check-mark"></i>
          </span>
          <span class="verified-tooltip">Đã xác minh</span>
        </span>
      </h1>
      <div class="bio-tagline">
        <i class="fas fa-user-graduate"></i> 
        <span class="typewriter" id="typewriterText"></span>
      </div>
    </div>

    <div class="bio-content fade-item">
      <p><i class="fas fa-location-dot"></i> Gia Lai, Việt Nam</p>
      
      <p class="live-info">
        <i class="fas fa-clock"></i>
        <span id="greetingText">Xin chào</span> • 
        <span id="liveClock">--:--:--</span>
        <span class="timezone-tag">GMT+7</span>
      </p>
      
      <p class="view-counter">
        <i class="fas fa-eye"></i>
        <span id="viewCount">0</span> lượt ghé thăm
      </p>
      
      <p class="bio-quote">"Anh vốn dĩ không phải người tốt, chỉ vì yêu em nên anh mới trở thành người tốt"</p>
    </div>

    <div class="social-links fade-item">
      <a href="https://www.facebook.com/share/14vDd2fvqQP/?mibextid=wwXIfr" target="_blank" class="social-icon"><i class="fab fa-facebook-f"></i></a>
      <a href="https://instagram.com/ten-cua-ban" target="_blank" class="social-icon"><i class="fab fa-instagram"></i></a>
      <a href="https://www.tiktok.com/@tyraeg_?_r=1&_t=ZS-9Ay5f1VKugM" target="_blank" class="social-icon"><i class="fab fa-tiktok"></i></a>
      <a href="https://github.com/" target="_blank" class="social-icon"><i class="fab fa-github"></i></a>
      <button class="social-icon" id="qrBtn" aria-label="Mã QR chia sẻ"><i class="fas fa-qrcode"></i></button>
    </div>

    <div class="music-player fade-item">
      <div class="music-info" id="musicInfo">
        <i class="fas fa-compact-disc"></i>
        <span id="trackName">Kẻ Điên Tin Vào Tình Yêu</span>
      </div>

      <div class="music-controls">
        <button class="music-btn" id="prevBtn" aria-label="Bài trước"><i class="fas fa-backward-step"></i></button>
        <button class="music-btn" id="playPauseBtn"><i class="fas fa-play" id="playIcon"></i></button>
        <button class="music-btn" id="nextBtn" aria-label="Bài sau"><i class="fas fa-forward-step"></i></button>
        <button class="music-btn" id="muteBtn"><i class="fas fa-volume-up" id="volumeIcon"></i></button>
      </div>

      <div class="progress-wrapper">
        <span class="time-display" id="currentTime">0:00</span>
        <div class="progress-container" id="progressContainer">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <span class="time-display" id="duration">0:00</span>
      </div>
      
      <div class="visualizer-container" id="visualizer"></div>

      <!-- Playlist Panel -->
      <div class="playlist-panel" id="playlistPanel">
        <div class="playlist-header">
          <span><i class="fas fa-list-music"></i> Danh sách phát</span>
          <button class="playlist-close" id="playlistClose"><i class="fas fa-times"></i></button>
        </div>
        <ul class="playlist-list" id="playlistList"></ul>
      </div>
    </div>
  </div>

  <!-- QR MODAL -->
  <div class="qr-modal" id="qrModal">
    <div class="qr-modal-content">
      <button class="qr-modal-close" id="qrModalClose"><i class="fas fa-times"></i></button>
      <h3><i class="fas fa-qrcode"></i> Quét để chia sẻ</h3>
      <div id="qrcodeContainer"></div>
      <p class="qr-url" id="qrUrl"></p>
      <button class="qr-copy-btn" id="qrCopyBtn"><i class="fas fa-copy"></i> Copy link</button>
    </div>
  </div>

  <script>
    // =========================================
    // 1. PARTICLES
    // =========================================
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.classList.add('particle');
      const size = Math.random() * 3 + 2;
      p.style.width = `${size}px`; p.style.height = `${size}px`;
      p.style.left = `${Math.random() * 100}vw`; p.style.top = `${Math.random() * 100}vh`;
      p.style.animationDuration = `${Math.random() * 10 + 10}s`;
      p.style.animationDelay = `${Math.random() * -20}s`;
      p.style.backgroundColor = Math.random() > 0.5 ? 'var(--accent1)' : 'var(--accent2)';
      particlesContainer.appendChild(p);
    }

    // =========================================
    // 2. PAW CLICK EFFECT
    // =========================================
    const pawSVG = `
      <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <path fill="url(#pawGradient)" d="M226.5,113.4c-2.7-31.1-27.3-54.3-55.4-51.8c-28.1,2.5-48.7,29.8-46,60.9c2.7,31.1,27.3,54.3,55.4,51.8
        C208.6,171.8,229.2,144.5,226.5,113.4z M120.4,200.9c-25.7-13.5-53.2,3.5-61.4,38c-8.2,34.5,6,73.4,31.7,86.9
        c25.7,13.5,53.2-3.5,61.4-38C160.3,253.3,146.1,214.4,120.4,200.9z M396,238.9c8.2,34.5,35.7,51.5,61.4,38
        c25.7-13.5,39.9-52.4,31.7-86.9c-8.2-34.5-35.7-51.5-61.4-38C401.9,165.5,387.8,204.4,396,238.9z M341.4,113.4
        c-2.7,31.1,17.9,58.4,46,60.9c28.1,2.5,52.7-20.7,55.4-51.8c2.7-31.1-17.9-58.4-46-60.9C368.7,59.1,344.1,82.3,341.4,113.4z
        M256,249.6c-59.2,0-120.9,44.6-135,106.1c-6.4,28,7.9,56.1,34.5,68c22,9.8,48.5,6.6,71.1-6.4c9.1-5.2,19-5.2,28.2,0
        c22.6,13,49.1,16.2,71.1,6.4c26.6-11.9,40.9-40,34.5-68C346.9,294.2,285.2,249.6,256,249.6z"/>
        <defs>
          <linearGradient id="pawGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="var(--accent1)" />
            <stop offset="100%" stop-color="var(--accent2)" />
          </linearGradient>
        </defs>
      </svg>
    `;

    document.addEventListener('click', function(e) {
      if (e.target.closest('button') || e.target.closest('a') || 
          e.target.closest('.progress-container') || 
          e.target.closest('.verified-wrapper') ||
          e.target.closest('.top-controls') ||
          e.target.closest('.splash-screen') ||
          e.target.closest('.qr-modal')) {
        return;
      }

      const paw = document.createElement('div');
      paw.classList.add('paw-click');
      paw.innerHTML = pawSVG; 
      
      paw.style.left = `${e.clientX}px`;
      paw.style.top = `${e.clientY}px`;
      
      const rot = (Math.random() * 60 - 30).toFixed(0);
      paw.style.setProperty('--rot', `${rot}deg`);
      
      const size = Math.random() * 20 + 30; 
      paw.style.width = `${size}px`;
      paw.style.height = `${size}px`;

      document.body.appendChild(paw);

      setTimeout(() => { paw.remove(); }, 1000);
    });

    // =========================================
    // 3. 3D TILT
    // =========================================
    const bioCard = document.getElementById('bioCard');
    if (window.innerWidth > 768) {
      document.addEventListener('mousemove', (e) => {
        if (!bioCard.classList.contains('show')) return;
        const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
        const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
        bioCard.style.transform = `translateY(0) scale(1) rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        particlesContainer.style.transform = `translate(${xAxis * -1.5}px, ${yAxis * -1.5}px)`;
      });
      document.addEventListener('mouseleave', () => {
        bioCard.style.transform = `translateY(0) scale(1) rotateY(0deg) rotateX(0deg)`;
        particlesContainer.style.transform = `translate(0, 0)`;
      });
    }

    // =========================================
    // 4. TOOLTIP XÁC MINH
    // =========================================
    const verifiedWrapper = document.getElementById('verifiedWrapper');
    let tooltipTimer = null;
    function showTooltip() {
      verifiedWrapper.classList.add('active');
      clearTimeout(tooltipTimer);
      tooltipTimer = setTimeout(() => verifiedWrapper.classList.remove('active'), 2000);
    }
    verifiedWrapper.addEventListener('click', (e) => { e.stopPropagation(); showTooltip(); });
    verifiedWrapper.addEventListener('touchstart', (e) => { e.stopPropagation(); showTooltip(); }, { passive: true });
    document.addEventListener('click', (e) => { if (!verifiedWrapper.contains(e.target)) verifiedWrapper.classList.remove('active'); });
    document.addEventListener('touchstart', (e) => { if (!verifiedWrapper.contains(e.target)) verifiedWrapper.classList.remove('active'); }, { passive: true });

    // =========================================
    // 5. TYPEWRITER
    // =========================================
    const typewriterEl = document.getElementById('typewriterText');
    const textToType = `High school student & Developer <i class="fas fa-code" style="color: var(--accent1); margin-left: 4px;"></i>`;
    let typeIndex = 0;
    let typewriterStarted = false;
    
    function typeWriter() {
      if (typewriterStarted) return;
      typewriterStarted = true;
      if (typeIndex < textToType.length) {
        typewriterEl.innerHTML = textToType.substring(0, typeIndex + 1);
        typeIndex++;
        setTimeout(typeWriter, 80);
      }
    }

    // =========================================
    // 6. THEME & MODE
    // =========================================
    const modeToggleBtn = document.getElementById('modeToggleBtn');
    const modeIcon = document.getElementById('modeIcon');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themePalette = document.getElementById('themePalette');
    const body = document.body;

    // Khôi phục theme từ localStorage
    const savedTheme = localStorage.getItem('pawdev_theme');
    if (savedTheme) body.classList.add(savedTheme);
    const savedMode = localStorage.getItem('pawdev_mode');
    if (savedMode === 'light') {
      body.classList.add('light-mode');
      modeIcon.classList.replace('fa-moon', 'fa-sun');
    }

    modeToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      body.classList.toggle('light-mode');
      const isLight = body.classList.contains('light-mode');
      if (isLight) {
        modeIcon.classList.replace('fa-moon', 'fa-sun');
        localStorage.setItem('pawdev_mode', 'light');
      } else {
        modeIcon.classList.replace('fa-sun', 'fa-moon');
        localStorage.setItem('pawdev_mode', 'dark');
      }
    });

    themeToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      themePalette.classList.toggle('active');
    });

    document.querySelectorAll('.color-dot').forEach(dot => {
      dot.addEventListener('click', (e) => {
        const theme = dot.getAttribute('data-theme');
        body.classList.remove('theme-blue', 'theme-purple', 'theme-green', 'theme-orange', 'theme-pink');
        body.classList.add(theme);
        localStorage.setItem('pawdev_theme', theme);
        themePalette.classList.remove('active');
      });
    });

    document.addEventListener('click', (e) => {
      if (!themePalette.contains(e.target) && e.target !== themeToggleBtn && !themeToggleBtn.contains(e.target)) {
        themePalette.classList.remove('active');
      }
    });

    // =========================================
    // 7. LIVE CLOCK + GREETING + VIEW COUNTER
    // =========================================
    (function() {
      const liveClock = document.getElementById('liveClock');
      const greetingText = document.getElementById('greetingText');
      const viewCountEl = document.getElementById('viewCount');

      function updateClock() {
        const now = new Date();
        const time = now.toLocaleTimeString('vi-VN', {
          timeZone: 'Asia/Ho_Chi_Minh',
          hour: '2-digit', minute: '2-digit', second: '2-digit',
          hour12: false
        });
        liveClock.textContent = time;

        const hourVN = parseInt(now.toLocaleString('en-US', {
          timeZone: 'Asia/Ho_Chi_Minh', hour: '2-digit', hour12: false
        }), 10);
        let greeting = 'Xin chào';
        if (hourVN >= 5 && hourVN < 11) greeting = 'Chào buổi sáng';
        else if (hourVN >= 11 && hourVN < 14) greeting = 'Chào buổi trưa';
        else if (hourVN >= 14 && hourVN < 18) greeting = 'Chào buổi chiều';
        else if (hourVN >= 18 && hourVN < 22) greeting = 'Chào buổi tối';
        else greeting = 'Khuya rồi, ngủ sớm nhé';
        greetingText.textContent = greeting;
      }
      updateClock();
      setInterval(updateClock, 1000);

      // View counter (localStorage)
      let views = parseInt(localStorage.getItem('pawdev_views') || '0', 10);
      views += 1;
      localStorage.setItem('pawdev_views', views);
      let current = 0;
      const target = views;
      const step = Math.max(1, Math.ceil(target / 30));
      const counterInterval = setInterval(() => {
        current += step;
        if (current >= target) { current = target; clearInterval(counterInterval); }
        viewCountEl.textContent = current;
      }, 40);
    })();

    // =========================================
    // 8. PLAYLIST NHẠC + VISUALIZER
    // =========================================
    let loadTrackExternal = null; // expose ra ngoài cho splash
    (function() {
      // 🎵 Danh sách nhạc - thay src bằng link của bạn
      const PLAYLIST = [
        { name: 'Kẻ Điên Tin Vào Tình Yêu', src: 'https://handsome-apricot-swtddb8f.edgeone.dev' }
        // Thêm bài mới ở đây, ví dụ:
        // { name: 'Tên bài 2', src: 'https://link-mp3-cua-ban.com/bai2.mp3' },
      ].filter(t => t.src);

      let currentIndex = parseInt(localStorage.getItem('pawdev_track') || '0', 10);
      if (currentIndex >= PLAYLIST.length) currentIndex = 0;

      const audio = new Audio();
      audio.loop = false;
      audio.volume = 0.7;
      audio.preload = 'auto';

      const splashScreen = document.getElementById('splashScreen');
      const playPauseBtn = document.getElementById('playPauseBtn');
      const playIcon = document.getElementById('playIcon');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const muteBtn = document.getElementById('muteBtn');
      const volumeIcon = document.getElementById('volumeIcon');
      const progressBar = document.getElementById('progressBar');
      const progressContainer = document.getElementById('progressContainer');
      const currentTimeEl = document.getElementById('currentTime');
      const durationEl = document.getElementById('duration');
      const musicInfo = document.getElementById('musicInfo');
      const trackNameEl = document.getElementById('trackName');
      const visualizerContainer = document.getElementById('visualizer');
      const playlistPanel = document.getElementById('playlistPanel');
      const playlistList = document.getElementById('playlistList');
      const playlistClose = document.getElementById('playlistClose');

      const bars = [];
      for (let i = 0; i < 15; i++) {
        const bar = document.createElement('div');
        bar.classList.add('vis-bar');
        visualizerContainer.appendChild(bar);
        bars.push(bar);
      }

      function animateVisualizer() {
        bars.forEach(bar => {
          if (!audio.paused) {
            bar.style.height = `${Math.random() * 90 + 10}%`;
          } else {
            bar.style.height = `5%`;
          }
        });
      }
      setInterval(animateVisualizer, 150);

      function formatTime(s) {
        if (isNaN(s) || s === Infinity) return "0:00";
        return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`;
      }

      function loadTrack(index, autoplay = false) {
        currentIndex = index;
        localStorage.setItem('pawdev_track', index);
        const track = PLAYLIST[index];
        audio.src = track.src;
        trackNameEl.textContent = track.name;
        progressBar.style.width = '0%';
        currentTimeEl.textContent = '0:00';
        durationEl.textContent = '0:00';
        renderPlaylist();
        if (autoplay) audio.play().catch(e => console.warn(e));
      }

      function renderPlaylist() {
        playlistList.innerHTML = '';
        PLAYLIST.forEach((track, i) => {
          const li = document.createElement('li');
          li.className = 'playlist-item' + (i === currentIndex ? ' active' : '');
          li.innerHTML = `
            <span class="track-index">${i === currentIndex ? '<i class="fas fa-volume-high"></i>' : (i+1)}</span>
            <span class="track-name">${track.name}</span>
          `;
          li.addEventListener('click', () => {
            loadTrack(i, true);
            playlistPanel.classList.remove('active');
          });
          playlistList.appendChild(li);
        });
      }

      function updatePlayIcon() {
        if (audio.paused) {
          playIcon.classList.replace('fa-pause', 'fa-play');
          playPauseBtn.style.animation = 'beat 1.5s infinite alternate';
          musicInfo.classList.remove('playing');
        } else {
          playIcon.classList.replace('fa-play', 'fa-pause');
          playPauseBtn.style.animation = 'none';
          musicInfo.classList.add('playing');
        }
      }

      function updateVolumeIcon() {
        if (audio.muted || audio.volume === 0) {
          volumeIcon.className = 'fas fa-volume-mute';
        } else if (audio.volume < 0.5) {
          volumeIcon.className = 'fas fa-volume-down';
        } else {
          volumeIcon.className = 'fas fa-volume-up';
        }
      }

      function updateProgress() {
        if (audio.duration) {
          progressBar.style.width = (audio.currentTime / audio.duration) * 100 + '%';
          currentTimeEl.textContent = formatTime(audio.currentTime);
        }
      }

      function togglePlay() {
        if (!audio.src) loadTrack(currentIndex, false);
        if (audio.paused) audio.play().catch(e => console.warn(e));
        else audio.pause();
        updatePlayIcon();
      }

      function toggleMute() {
        audio.muted = !audio.muted;
        updateVolumeIcon();
      }

      splashScreen.addEventListener('click', () => {
        loadTrack(currentIndex, false);
        audio.play().catch(err => console.log('Lỗi phát nhạc:', err));
        splashScreen.classList.add('hidden');
        bioCard.classList.add('show');
        setTimeout(() => typeWriter(), 500);
      });

      progressContainer.addEventListener('click', (e) => {
        const rect = progressContainer.getBoundingClientRect();
        const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        if (audio.duration) audio.currentTime = pos * audio.duration;
      });

      playPauseBtn.addEventListener('click', togglePlay);
      muteBtn.addEventListener('click', toggleMute);
      prevBtn.addEventListener('click', () => {
        loadTrack((currentIndex - 1 + PLAYLIST.length) % PLAYLIST.length, true);
      });
      nextBtn.addEventListener('click', () => {
        loadTrack((currentIndex + 1) % PLAYLIST.length, true);
      });

      // Mở playlist khi nhấn vào tên bài
      musicInfo.style.cursor = 'pointer';
      musicInfo.title = 'Nhấn để xem danh sách phát';
      musicInfo.addEventListener('click', () => {
        playlistPanel.classList.toggle('active');
      });
      playlistClose.addEventListener('click', () => playlistPanel.classList.remove('active'));

      audio.addEventListener('play', updatePlayIcon);
      audio.addEventListener('pause', updatePlayIcon);
      audio.addEventListener('volumechange', updateVolumeIcon);
      audio.addEventListener('timeupdate', updateProgress);
      audio.addEventListener('loadedmetadata', () => {
        durationEl.textContent = formatTime(audio.duration);
        updateProgress();
        updateVolumeIcon();
        updatePlayIcon();
      });
      audio.addEventListener('ended', () => {
        const next = (currentIndex + 1) % PLAYLIST.length;
        loadTrack(next, true);
      });
      audio.addEventListener('error', () => {
        trackNameEl.textContent = 'Không tải được nhạc';
        durationEl.textContent = '0:00';
      });

      loadTrack(currentIndex, false);
      updateVolumeIcon();
      loadTrackExternal = loadTrack;
    })();

    // =========================================
    // 9. QR CODE MODAL
    // =========================================
    (function() {
      const qrBtn = document.getElementById('qrBtn');
      const qrModal = document.getElementById('qrModal');
      const qrModalClose = document.getElementById('qrModalClose');
      const qrContainer = document.getElementById('qrcodeContainer');
      const qrUrlEl = document.getElementById('qrUrl');
      const qrCopyBtn = document.getElementById('qrCopyBtn');

      qrBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const url = window.location.href;
        qrContainer.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(url)}" alt="QR Code" width="220" height="220" style="border-radius: 0.5rem;">`;
        qrUrlEl.textContent = url;
        qrModal.classList.add('active');
      });

      function closeModal() { qrModal.classList.remove('active'); }
      qrModalClose.addEventListener('click', closeModal);
      qrModal.addEventListener('click', (e) => { if (e.target === qrModal) closeModal(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

      qrCopyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(window.location.href).then(() => {
          qrCopyBtn.innerHTML = '<i class="fas fa-check"></i> Đã copy!';
          setTimeout(() => {
            qrCopyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy link';
          }, 1800);
        });
      });
    })();

    // =========================================
    // 10. AVATAR THEO MÙA
    // =========================================
    (function() {
      const avatarWrapper = document.getElementById('avatarWrapper');
      if (!avatarWrapper) return;

      const now = new Date();
      const m = now.getMonth() + 1;
      const d = now.getDate();
      let season = null;

      if ((m === 12 && d >= 24) || (m === 1 && d <= 2)) season = 'christmas';
      else if (m === 10 && d >= 25) season = 'halloween';
      else if (m === 1 && d >= 1 && d <= 3) season = 'newyear';
      else if (m === 1 || m === 2) season = 'tet';
      else if (m >= 10 && m <= 11) season = 'halloween';

      if (season) avatarWrapper.classList.add(`season-${season}`);
    })();

    // =========================================
    // 11. PWA SERVICE WORKER
    // =========================================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('✅ PWA SW đã đăng ký:', reg.scope))
          .catch(err => console.warn('⚠️ PWA SW lỗi:', err));
      });
    }
  </script>
</body>
</html>
