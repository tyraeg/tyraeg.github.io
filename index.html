<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio • Nhạc nền</title>
  <!-- Font Awesome icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #0b0f1a 0%, #1a1f2e 100%);
      padding: 1rem;
    }

    /* Hiệu ứng ánh sáng nền */
    .glow {
      position: fixed;
      width: 60vmax;
      height: 60vmax;
      background: radial-gradient(circle, rgba(100, 210, 255, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      top: -20vmax;
      left: -20vmax;
      z-index: 0;
      pointer-events: none;
      animation: floatGlow 14s infinite alternate ease-in-out;
    }

    .glow2 {
      position: fixed;
      width: 70vmax;
      height: 70vmax;
      background: radial-gradient(circle, rgba(200, 100, 255, 0.12) 0%, transparent 70%);
      border-radius: 50%;
      bottom: -30vmax;
      right: -20vmax;
      z-index: 0;
      pointer-events: none;
      animation: floatGlow 18s infinite alternate-reverse ease-in-out;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(6vmax, 4vmax) scale(1.1); }
    }

    /* Card chính */
    .bio-card {
      position: relative;
      z-index: 10;
      background: rgba(20, 25, 35, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 3rem 1rem 3rem 1rem;
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(120, 180, 255, 0.1) inset;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 620px;
      transition: all 0.3s ease;
      animation: cardAppear 0.9s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    @keyframes cardAppear {
      0% { opacity: 0; transform: translateY(30px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .bio-card:hover {
      border-color: rgba(150, 200, 255, 0.25);
      box-shadow: 0 30px 55px -12px #000000cc, 0 0 0 1px rgba(120, 200, 255, 0.25) inset;
    }

    /* Avatar */
    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1.8rem;
    }

    .avatar-wrapper {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3a7bd5, #9d4edd);
      padding: 3px;
      margin-bottom: 1rem;
      box-shadow: 0 0 25px rgba(100, 180, 255, 0.4);
      transition: transform 0.3s ease;
    }

    .avatar-wrapper:hover {
      transform: scale(1.02);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #1e2433 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="40" r="22" fill="%236c8ef5"/><circle cx="50" cy="50" r="38" fill="none" stroke="%236c8ef5" stroke-width="2" stroke-dasharray="6 6"/><circle cx="50" cy="40" r="12" fill="%23222a3a"/><circle cx="50" cy="40" r="8" fill="%239d4edd"/></svg>') center/cover no-repeat;
      background-size: 75%;
      background-position: 50% 45%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .bio-name {
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #b0d0ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 2px 10px rgba(100, 180, 255, 0.3);
      margin-bottom: 0.25rem;
      text-align: center;
    }

    .bio-tagline {
      color: #8fa5cc;
      font-size: 1rem;
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .bio-tagline i {
      color: #5d9eff;
      font-size: 0.9rem;
    }

    /* Thông tin bio */
    .bio-content {
      margin: 1.8rem 0 2rem;
      color: #d0ddf5;
      font-size: 1rem;
      line-height: 1.7;
      text-align: center;
      padding: 0 0.5rem;
    }

    .bio-content p {
      margin-bottom: 0.7rem;
    }

    .bio-content i {
      color: #7aa9ff;
      margin-right: 6px;
      width: 1.2rem;
      text-align: center;
    }

    .highlight {
      color: #fff;
      font-weight: 600;
      background: linear-gradient(120deg, #1e3a5f, transparent);
      padding: 0.1rem 0.4rem;
      border-radius: 6px;
      display: inline-block;
    }

    /* Social icons */
    .social-links {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      margin-bottom: 2.2rem;
      flex-wrap: wrap;
    }

    .social-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 3rem;
      height: 3rem;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.04);
      color: #cddfff;
      font-size: 1.4rem;
      transition: all 0.25s ease;
      border: 1px solid rgba(255, 255, 255, 0.06);
      text-decoration: none;
    }

    .social-icon:hover {
      background: #2a3b5a;
      color: #ffffff;
      transform: translateY(-4px);
      border-color: #5d9eff;
      box-shadow: 0 12px 18px -8px #2a6bc0;
    }

    /* Music player */
    .music-player {
      background: rgba(10, 15, 25, 0.7);
      border-radius: 3rem;
      padding: 0.6rem 0.6rem 0.6rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      border: 1px solid rgba(100, 160, 255, 0.25);
      box-shadow: 0 8px 20px -10px #000000, 0 0 0 1px rgba(80, 140, 255, 0.2) inset;
      backdrop-filter: blur(8px);
      transition: border-color 0.3s;
      flex-wrap: wrap;
      justify-content: center;
    }

    .music-player:hover {
      border-color: rgba(130, 190, 255, 0.55);
    }

    .music-info {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex: 1 1 180px;
      color: #b8ceff;
      font-size: 0.95rem;
      font-weight: 500;
      white-space: nowrap;
    }

    .music-info i {
      color: #5d9eff;
      font-size: 1.4rem;
      animation: pulseNote 1.8s infinite;
    }

    @keyframes pulseNote {
      0% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0.8; transform: scale(1); }
    }

    .music-controls {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .music-btn {
      background: rgba(255, 255, 255, 0.06);
      border: none;
      color: #d0e0ff;
      width: 2.8rem;
      height: 2.8rem;
      border-radius: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .music-btn:hover {
      background: #2a4b7a;
      color: white;
      border-color: #6ea8ff;
    }

    .music-btn:active {
      transform: scale(0.94);
    }

    /* Thanh tiến trình mini */
    .progress-container {
      flex: 2 2 140px;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      margin: 0 0.5rem;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4f9eff, #b06eff);
      border-radius: 10px;
      transition: width 0.2s linear;
    }

    /* Lưu ý nhỏ */
    .music-note {
      font-size: 0.7rem;
      color: #6a7fa0;
      text-align: center;
      margin-top: 1rem;
      letter-spacing: 0.5px;
    }

    /* Responsive */
    @media (max-width: 500px) {
      .bio-card {
        padding: 1.8rem 1.2rem;
        border-radius: 2rem 0.8rem 2rem 0.8rem;
      }
      .bio-name {
        font-size: 1.7rem;
      }
      .avatar-wrapper {
        width: 100px;
        height: 100px;
      }
      .music-player {
        padding: 0.8rem 1rem;
        gap: 0.8rem;
      }
      .music-info {
        font-size: 0.85rem;
        gap: 0.4rem;
      }
      .music-btn {
        width: 2.4rem;
        height: 2.4rem;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Hiệu ứng nền -->
  <div class="glow"></div>
  <div class="glow2"></div>

  <div class="bio-card">
    <!-- Avatar + Tên -->
    <div class="avatar-section">
      <div class="avatar-wrapper">
        <div class="avatar"></div>
      </div>
      <h1 class="bio-name">Alex Rivers</h1>
      <div class="bio-tagline">
        <!-- Đã đổi thành icon tốt nghiệp -->
        <i class="fas fa-user-graduate"></i> Sound designer & developer 
        <i class="fas fa-code"></i>
      </div>
    </div>

    <!-- Nội dung bio (Đã xoá 2 dòng) -->
    <div class="bio-content">
      <p><i class="fas fa-location-dot"></i> Đà Nẵng, Việt Nam</p>
      <p style="font-size:0.95rem; opacity:0.9; margin-top:1rem;">“Tạo ra trải nghiệm – từ giai điệu đến từng dòng code.”</p>
    </div>

    <!-- Social -->
    <div class="social-links">
      <a href="#" class="social-icon" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
      <a href="#" class="social-icon" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="#" class="social-icon" aria-label="GitHub"><i class="fab fa-github"></i></a>
      <a href="#" class="social-icon" aria-label="Spotify"><i class="fab fa-spotify"></i></a>
    </div>

    <!-- Music player -->
    <div class="music-player">
      <div class="music-info">
        <i class="fas fa-music"></i>
        <span id="trackName">Ambient Waves</span>
      </div>

      <!-- Thanh tiến trình nhỏ -->
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="music-controls">
        <button class="music-btn" id="playPauseBtn" aria-label="Play/Pause">
          <i class="fas fa-play" id="playIcon"></i>
        </button>
        <button class="music-btn" id="muteBtn" aria-label="Mute/Unmute">
          <i class="fas fa-volume-up" id="volumeIcon"></i>
        </button>
      </div>
    </div>
    <div class="music-note">
      <i class="fas fa-circle-info"></i> Nhạc nền tự động phát (nhấn play nếu trình duyệt chặn)
    </div>
  </div>

  <!-- Audio element -->
  <audio id="bgMusic" loop preload="auto" src="https://ia800905.us.archive.org/14/items/Ambient_Sounds/Ambient_Sounds/ambient_waves.mp3"></audio>

  <script>
    (function() {
      const audio = document.getElementById('bgMusic');
      const playPauseBtn = document.getElementById('playPauseBtn');
      const playIcon = document.getElementById('playIcon');
      const muteBtn = document.getElementById('muteBtn');
      const volumeIcon = document.getElementById('volumeIcon');
      const progressBar = document.getElementById('progressBar');
      const trackName = document.getElementById('trackName');

      audio.volume = 0.7;

      function updatePlayIcon() {
        if (audio.paused) {
          playIcon.classList.remove('fa-pause');
          playIcon.classList.add('fa-play');
        } else {
          playIcon.classList.remove('fa-play');
          playIcon.classList.add('fa-pause');
        }
      }

      function updateVolumeIcon() {
        if (audio.muted || audio.volume === 0) {
          volumeIcon.classList.remove('fa-volume-up', 'fa-volume-down');
          volumeIcon.classList.add('fa-volume-mute');
        } else if (audio.volume < 0.5) {
          volumeIcon.classList.remove('fa-volume-up', 'fa-volume-mute');
          volumeIcon.classList.add('fa-volume-down');
        } else {
          volumeIcon.classList.remove('fa-volume-down', 'fa-volume-mute');
          volumeIcon.classList.add('fa-volume-up');
        }
      }

      function updateProgress() {
        if (audio.duration) {
          const percent = (audio.currentTime / audio.duration) * 100;
          progressBar.style.width = percent + '%';
        } else {
          progressBar.style.width = '0%';
        }
      }

      function togglePlay() {
        if (audio.paused) {
          audio.play().catch(error => {
            console.warn('Không thể tự động phát: ', error);
            playIcon.classList.remove('fa-pause');
            playIcon.classList.add('fa-play');
          });
        } else {
          audio.pause();
        }
        updatePlayIcon();
      }

      function toggleMute() {
        audio.muted = !audio.muted;
        updateVolumeIcon();
      }

      playPauseBtn.addEventListener('click', togglePlay);
      muteBtn.addEventListener('click', toggleMute);

      audio.addEventListener('play', () => {
        updatePlayIcon();
        updateVolumeIcon();
      });

      audio.addEventListener('pause', () => {
        updatePlayIcon();
      });

      audio.addEventListener('volumechange', updateVolumeIcon);
      audio.addEventListener('timeupdate', updateProgress);

      audio.addEventListener('loadedmetadata', () => {
        updateProgress();
        updateVolumeIcon();
        updatePlayIcon();
      });

      window.addEventListener('load', () => {
        audio.play().catch(err => {
          console.log('Tự động phát bị chặn. Nhấn nút play để bắt đầu.');
          updatePlayIcon(); 
        });
        updateVolumeIcon();
      });

      audio.addEventListener('error', (e) => {
        console.warn('Lỗi âm thanh:', e);
        trackName.textContent = 'Không tải được nhạc';
        progressBar.style.width = '0%';
      });

      audio.addEventListener('canplay', () => {
        updatePlayIcon();
        updateVolumeIcon();
        if (audio.duration) {
          updateProgress();
        }
      });
    })();
  </script>
</body>
</html>
