<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio & Music</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            background-image: radial-gradient(white 1px, transparent 0);
            background-size: 40px 40px;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .wrapper {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .glass-card {
            background: rgba(20, 20, 20, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 12px auto;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .profile-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 18px;
        }

        .social-icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .social-icon-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .player-card {
            background: rgba(20, 20, 20, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .player-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .song-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .song-info i {
            color: #f43f5e;
            font-size: 1rem;
        }

        .song-title {
            font-size: 0.9rem;
            font-weight: 500;
            color: #e2e8f0;
            letter-spacing: 0.5px;
        }

        .play-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1rem;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .play-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .player-progress-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            outline: none;
            appearance: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Khung Bio chính -->
        <div class="glass-card">
            <div class="avatar-container">
                <img src="https://via.placeholder.com/150" alt="Avatar" class="avatar">
            </div>

            <div class="profile-name">Lê Trung</div>

            <div class="social-icons">
                <a href="https://facebook.com" target="_blank" class="social-icon-btn" title="Facebook">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>
                <a href="https://tiktok.com" target="_blank" class="social-icon-btn" title="TikTok">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
            </div>
        </div>

        <!-- Khung Trình phát nhạc -->
        <div class="player-card">
            <div class="player-top">
                <div class="song-info">
                    <i class="fa-solid fa-compact-disc" id="discIcon"></i>
                    <span class="song-title" id="songTitle">anhyeuem</span>
                </div>
                <button class="play-btn" onclick="togglePlay()">
                    <i class="fa-solid fa-play" id="playIcon"></i>
                </button>
            </div>

            <div class="player-progress-area">
                <span id="currentTime">0:00</span>
                <input type="range" min="0" max="100" value="0" class="progress-bar" id="progressBar">
                <span id="durationTime">0:00</span>
            </div>
        </div>
    </div>

    <!-- Thẻ Audio có autoplay -->
    <audio id="audioElement" src="https://necessary-maroon-afod0mik.edgeone.dev/" preload="metadata" loop autoplay></audio>

    <script>
        const audio = document.getElementById('audioElement');
        const playIcon = document.getElementById('playIcon');
        const discIcon = document.getElementById('discIcon');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        
        let isPlaying = false;

        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                playIcon.className = "fa-solid fa-play";
                discIcon.style.animation = "none";
                isPlaying = false;
            } else {
                audio.play().then(() => {
                    playIcon.className = "fa-solid fa-pause";
                    discIcon.style.animation = "spin 3s linear infinite";
                    isPlaying = true;
                }).catch(e => console.log(e));
            }
        }

        function formatTime(seconds) {
            let mins = Math.floor(seconds / 60);
            let secs = Math.floor(seconds % 60);
            return mins + ":" + (secs < 10 ? "0" : "") + secs;
        }

        audio.addEventListener('loadedmetadata', () => {
            durationTimeEl.innerText = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', () => {
            currentTimeEl.innerText = formatTime(audio.currentTime);
            if(audio.duration) {
                progressBar.value = (audio.currentTime / audio.duration) * 100;
            }
        });

        progressBar.addEventListener('input', () => {
            if(audio.duration) {
                audio.currentTime = (progressBar.value / 100) * audio.duration;
            }
        });

        const styleSheet = document.createElement("style");
        styleSheet.innerText = `@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }`;
        document.head.appendChild(styleSheet);

        // Tự động phát nhạc ngay khi vào web
        window.addEventListener('DOMContentLoaded', () => {
            audio.volume = 0.5;
            audio.play().then(() => {
                playIcon.className = "fa-solid fa-pause";
                discIcon.style.animation = "spin 3s linear infinite";
                isPlaying = true;
            }).catch(() => {
                // Nếu trình duyệt chặn tự động phát, tự bật khi người dùng có hành động chạm/click đầu tiên
                const unlock = () => {
                    audio.play().then(() => {
                        playIcon.className = "fa-solid fa-pause";
                        discIcon.style.animation = "spin 3s linear infinite";
                        isPlaying = true;
                        document.removeEventListener('click', unlock);
                        document.removeEventListener('touchstart', unlock);
                    });
                };
                document.addEventListener('click', unlock);
                document.addEventListener('touchstart', unlock);
            });
        });
    </script>

</body>
</html>
