<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin • Quản lý Kho App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
    body {
      background: radial-gradient(ellipse at top, #1a1d28 0%, #0a0c10 100%);
      color: #f5f7fa; min-height: 100vh; padding: 2rem 1rem;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background:
        radial-gradient(circle at 15% 20%, rgba(59,130,246,0.1), transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(139,92,246,0.1), transparent 40%);
      pointer-events: none; z-index: 0;
    }
    .icon { display: inline-block; width: 1em; height: 1em; vertical-align: -0.125em;
      fill: none; stroke: currentColor; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    /* ===== LOGIN ===== */
    .login-screen {
      position: fixed; inset: 0; z-index: 5000;
      background: radial-gradient(ellipse at center, #1a1d28 0%, #0a0c10 100%);
      display: flex; align-items: center; justify-content: center; padding: 1rem;
      transition: opacity 0.35s, visibility 0.35s;
    }
    .login-screen.hidden { opacity: 0; visibility: hidden; }
    .login-box {
      background: rgba(30, 33, 44, 0.8); backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px; padding: 2.5rem 2rem;
      max-width: 400px; width: 100%;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
      text-align: center; position: relative; overflow: hidden;
    }
    .login-box::before {
      content: ''; position: absolute; top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle at 30% 30%, rgba(59,130,246,0.15), transparent 50%);
      pointer-events: none;
    }
    .login-logo {
      width: 72px; height: 72px; border-radius: 22px; margin: 0 auto 1.25rem;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 1.8rem;
      box-shadow: 0 15px 35px rgba(59,130,246,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
      position: relative; z-index: 1;
    }
    .login-logo .icon { width: 2rem; height: 2rem; stroke-width: 2; }
    .login-box h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 0.4rem; color: #fff; position: relative; z-index: 1; }
    .login-box p { font-size: 0.85rem; color: #9ca3af; margin-bottom: 1.5rem; position: relative; z-index: 1; }
    .login-field { position: relative; margin-bottom: 0.85rem; text-align: left; z-index: 1; }
    .login-field label {
      display: block; font-size: 0.7rem; font-weight: 700; color: #9ca3af;
      margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .login-field input {
      width: 100%; font-family: inherit; font-size: 0.9rem; padding: 0.8rem 1rem;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
      background: rgba(255,255,255,0.04); color: #fff; outline: none;
      transition: all 0.2s;
    }
    .login-field input:focus {
      border-color: #3b82f6; background: rgba(59,130,246,0.08);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    .login-field input::placeholder { color: #6b7280; }
    .login-field .toggle-pass {
      position: absolute; right: 0.6rem; bottom: 0.5rem;
      background: transparent; border: none; cursor: pointer;
      color: #9ca3af; font-size: 1rem; padding: 0.3rem 0.5rem;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px; transition: all 0.2s;
    }
    .login-field .toggle-pass:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .login-field .toggle-pass .icon { width: 1.1rem; height: 1.1rem; }
    .login-btn {
      width: 100%; font-family: inherit; font-size: 0.95rem; font-weight: 700;
      padding: 0.9rem; border-radius: 14px; border: none; cursor: pointer;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: #fff;
      box-shadow: 0 8px 24px rgba(59,130,246,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
      transition: all 0.3s; margin-top: 0.5rem;
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      position: relative; z-index: 1;
    }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(59,130,246,0.55), inset 0 1px 0 rgba(255,255,255,0.2); }
    .login-btn:active { transform: scale(0.98); }
    .login-error {
      background: rgba(220,38,38,0.1); color: #f87171; font-size: 0.8rem; font-weight: 600;
      padding: 0.7rem 0.9rem; border-radius: 12px; margin-bottom: 0.75rem;
      display: none; text-align: left; align-items: center; gap: 0.4rem;
      border: 1px solid rgba(220,38,38,0.2); position: relative; z-index: 1;
    }
    .login-error.show { display: flex; }
    .login-error .icon { width: 1rem; height: 1rem; flex-shrink: 0; }
    .login-copyright {
      margin-top: 1.5rem; font-size: 0.72rem; color: #6b7280;
      padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.06);
      line-height: 1.5; position: relative; z-index: 1;
    }
    .login-copyright strong { color: #60a5fa; font-weight: 700; }

    /* ===== ADMIN ===== */
    .wrap { max-width: 960px; margin: 0 auto; display: none; position: relative; z-index: 1; }
    .wrap.active { display: block; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.75rem; flex-wrap: wrap; gap: 1rem;
    }
    header h1 {
      font-size: 1.7rem; font-weight: 800; letter-spacing: -0.5px;
      display: flex; align-items: center; gap: 0.6rem;
    }
    header h1 .icon {
      color: #3b82f6; width: 1.5rem; height: 1.5rem;
      padding: 0.5rem; background: rgba(59,130,246,0.15);
      border-radius: 12px; box-sizing: content-box;
    }
    header h1 span { background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .header-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .btn {
      font-family: inherit; font-size: 0.85rem; font-weight: 600; padding: 0.65rem 1.1rem;
      border-radius: 12px; border: none; cursor: pointer; transition: all 0.25s;
      display: inline-flex; align-items: center; gap: 0.4rem;
    }
    .btn .icon { width: 1rem; height: 1rem; }
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: #fff;
      box-shadow: 0 6px 20px rgba(59,130,246,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(59,130,246,0.55), inset 0 1px 0 rgba(255,255,255,0.2); }
    .btn-ghost { background: rgba(255,255,255,0.05); color: #e5e7eb; border: 1px solid rgba(255,255,255,0.1); }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
    .btn-danger { background: rgba(220,38,38,0.15); color: #f87171; border: 1px solid rgba(220,38,38,0.3); }
    .btn-danger:hover { background: rgba(220,38,38,0.25); }
    .btn-sm { padding: 0.45rem 0.8rem; font-size: 0.75rem; border-radius: 9px; }
    .btn-sm .icon { width: 0.85rem; height: 0.85rem; }
    .btn-logout { background: rgba(255,255,255,0.05); color: #9ca3af; border: 1px solid rgba(255,255,255,0.1); }
    .btn-logout:hover { background: rgba(220,38,38,0.15); color: #f87171; border-color: rgba(220,38,38,0.3); }

    .sync-status {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 0.72rem; font-weight: 600; color: #10b981;
      background: rgba(16,185,129,0.12); padding: 0.45rem 0.8rem; border-radius: 999px;
      transition: all 0.3s; border: 1px solid rgba(16,185,129,0.2);
    }
    .sync-status.syncing { color: #f59e0b; background: rgba(245,158,11,0.12); border-color: rgba(245,158,11,0.2); }
    .sync-status.error { color: #f87171; background: rgba(220,38,38,0.12); border-color: rgba(220,38,38,0.2); }
    .sync-status .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 0.85rem; margin-bottom: 1.5rem; }
    .stat {
      background: rgba(30, 33, 44, 0.6); backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; padding: 1.1rem;
      position: relative; overflow: hidden;
      transition: all 0.3s;
    }
    .stat:hover { border-color: rgba(255,255,255,0.12); transform: translateY(-2px); }
    .stat::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
    }
    .stat-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; color: #6b7280; letter-spacing: 0.5px; margin-bottom: 0.4rem; }
    .stat-value { font-size: 1.5rem; font-weight: 900; color: #fff; letter-spacing: -0.5px; }
    .stat-value.blue { color: #60a5fa; }
    .stat-value.orange { color: #fbbf24; }
    .stat-value.green { color: #34d399; }
    .stat-value.red { color: #f87171; }

    .app-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .app-row {
      background: rgba(30, 33, 44, 0.6); backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.06); border-radius: 18px;
      padding: 0.9rem 1rem; display: flex; align-items: center; gap: 0.9rem;
      transition: all 0.25s;
    }
    .app-row:hover { box-shadow: 0 10px 30px rgba(0,0,0,0.3); transform: translateY(-1px); border-color: rgba(255,255,255,0.12); }
    .app-icon {
      width: 2.8rem; height: 2.8rem; border-radius: 12px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
    }
    .app-icon svg { width: 100%; height: 100%; }
    .app-icon img { width: 100%; height: 100%; object-fit: cover; }
    .app-info { flex: 1 1 auto; min-width: 0; }
    .app-name { font-size: 0.9rem; font-weight: 700; margin-bottom: 0.25rem; display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; color: #f5f7fa; }
    .app-meta { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; font-size: 0.72rem; color: #9ca3af; }
    .badge {
      font-size: 0.6rem; font-weight: 800; letter-spacing: 0.4px;
      padding: 0.15rem 0.45rem; border-radius: 5px; text-transform: uppercase;
    }
    .badge.ipa { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .badge.tipa { background: rgba(245,158,11,0.15); color: #fbbf24; }
    .badge.apk { background: rgba(16,185,129,0.15); color: #34d399; }
    .badge.deb { background: rgba(220,38,38,0.15); color: #f87171; }
    .app-actions { display: flex; gap: 0.35rem; flex-shrink: 0; }

    .empty { text-align: center; padding: 3rem 1rem; color: #6b7280; font-weight: 500; }
    .empty .icon { width: 2.5rem; height: 2.5rem; margin-bottom: 0.5rem; color: #4b5563; }
    .empty p { margin-top: 0.3rem; font-size: 0.85rem; }

    /* ===== MODAL ===== */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px); display: flex; align-items: flex-start;
      justify-content: center; z-index: 1000; opacity: 0; visibility: hidden;
      transition: all 0.25s; padding: 1rem; overflow-y: auto;
    }
    .modal.active { opacity: 1; visibility: visible; }
    .modal-box {
      background: linear-gradient(180deg, rgba(30,33,44,0.98) 0%, rgba(20,23,32,0.98) 100%);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px; padding: 2rem 1.5rem 1.5rem;
      max-width: 620px; width: 100%; margin: auto; position: relative;
      transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.2,0.9,0.3,1);
      box-shadow: 0 30px 80px rgba(0,0,0,0.8);
    }
    .modal.active .modal-box { transform: scale(1); }
    .modal-box h2 { font-size: 1.2rem; font-weight: 800; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem; color: #fff; }
    .modal-box h2 .icon { color: #60a5fa; width: 1.2rem; height: 1.2rem; padding: 0.35rem; background: rgba(59,130,246,0.15); border-radius: 8px; box-sizing: content-box; }
    .close-x {
      position: absolute; top: 0.9rem; right: 0.9rem; width: 2rem; height: 2rem;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center; color: #9ca3af;
      transition: all 0.2s;
    }
    .close-x:hover { background: rgba(220,38,38,0.2); color: #f87171; border-color: rgba(220,38,38,0.3); transform: rotate(90deg); }
    .close-x .icon { width: 1rem; height: 1rem; }
    .form-group { margin-bottom: 0.9rem; }
    .form-group label { display: block; font-size: 0.72rem; font-weight: 700; color: #9ca3af; margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.4px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; font-family: inherit; font-size: 0.88rem; padding: 0.7rem 0.9rem;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
      background: rgba(255,255,255,0.04); color: #fff; outline: none;
      transition: all 0.2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: #3b82f6; background: rgba(59,130,246,0.08);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    .form-group input::placeholder, .form-group textarea::placeholder { color: #6b7280; }
    .form-group textarea { resize: vertical; min-height: 60px; }
    .form-group small { display: block; font-size: 0.7rem; color: #6b7280; margin-top: 0.3rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
    .checkbox-row {
      display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem;
      padding: 0.5rem 0.75rem; background: rgba(255,255,255,0.04);
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.08);
    }
    .checkbox-row input { width: auto; accent-color: #3b82f6; }
    .checkbox-row label { margin: 0; text-transform: none; letter-spacing: 0; font-size: 0.85rem; color: #e5e7eb; font-weight: 500; }
    .preview {
      display: flex; align-items: center; gap: 0.85rem;
      padding: 0.85rem; background: rgba(255,255,255,0.03);
      border-radius: 14px; border: 1px dashed rgba(255,255,255,0.15);
      margin-bottom: 1rem;
    }
    .preview .app-icon { background: rgba(255,255,255,0.08); }
    .modal-actions { display: flex; gap: 0.5rem; margin-top: 1.25rem; }
    .modal-actions .btn { flex: 1; justify-content: center; }

    .toast {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translate(-50%, 150%);
      background: #1a1d23; color: #fff; padding: 0.85rem 1.4rem; border-radius: 14px;
      font-size: 0.85rem; font-weight: 600;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      opacity: 0; transition: all 0.35s cubic-bezier(0.2,0.9,0.3,1.2); pointer-events: none; z-index: 2000;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .toast.error { background: #7f1d1d; border-color: rgba(220,38,38,0.4); }
    .toast .icon { width: 1rem; height: 1rem; color: #34d399; }
    .toast.error .icon { color: #f87171; }

    @media (max-width: 520px) {
      header h1 { font-size: 1.4rem; }
      header h1 .icon { width: 1.2rem; height: 1.2rem; padding: 0.4rem; }
      .app-row { padding: 0.75rem; gap: 0.65rem; }
      .app-icon { width: 2.4rem; height: 2.4rem; }
      .app-name { font-size: 0.85rem; }
      .form-row { grid-template-columns: 1fr; }
      .app-actions .btn { padding: 0.4rem 0.65rem; }
      .login-box { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>

  </svg>

  <!-- LOGIN -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <div class="login-logo"><svg class="icon"><use href="#i-lock"/></svg></div>
      <h2>Đăng nhập Admin</h2>
      <p>Nhập tài khoản để quản lý kho app</p>
      <div class="login-error" id="loginError"><svg class="icon"><use href="#i-alert"/></svg><span>Sai tài khoản hoặc mật khẩu</span></div>
      <div class="login-field">
        <label>Tài khoản</label>
        <input type="text" id="loginUser" placeholder="admin" autocomplete="username">
      </div>
      <div class="login-field">
        <label>Mật khẩu</label>
        <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
        <button class="toggle-pass" id="togglePass" type="button" aria-label="Hiện mật khẩu"><svg class="icon" id="togglePassIcon"><use href="#i-eye"/></svg></button>
      </div>
      <button class="login-btn" id="loginBtn"><svg class="icon"><use href="#i-shield"/></svg>Đăng nhập</button>
      <div class="login-copyright">© 2025 <strong>Lê Bảo Trung</strong>. Bản quyền thuộc về tác giả.<br>Mọi hành vi sao chép đều bị nghiêm cấm.</div>
    </div>
  </div>

  <!-- ADMIN -->
  <div class="wrap" id="adminWrap">
    <header>
      <h1><svg class="icon"><use href="#i-settings"/></svg>Admin <span>Kho App</span></h1>
      <div class="header-actions">
        <span class="sync-status syncing" id="syncStatus"><span class="dot"></span><span id="syncText">Đang kết nối...</span></span>
        <button class="btn btn-primary" id="addBtn"><svg class="icon"><use href="#i-plus"/></svg>Thêm app</button>
        <button class="btn btn-logout" id="logoutBtn"><svg class="icon"><use href="#i-logout"/></svg>Đăng xuất</button>
      </div>
    </header>
    <div class="stats" id="stats"></div>
    <div class="app-list" id="appList"></div>
  </div>

  <!-- MODAL -->
  <div class="modal" id="editModal">
    <div class="modal-box">
      <button class="close-x" id="closeModal" aria-label="Đóng"><svg class="icon"><use href="#i-close"/></svg></button>
      <h2 id="modalTitle"><svg class="icon"><use href="#i-plus"/></svg><span>Thêm app mới</span></h2>

      <div class="preview">
        <div class="app-icon" id="previewIcon"></div>
        <div style="flex:1;">
          <div style="font-size:0.9rem;font-weight:700;color:#fff;" id="previewName">Tên app</div>
          <div style="font-size:0.75rem;color:#9ca3af;" id="previewMeta">v1.0 • IPA</div>
        </div>
      </div>

      <form id="appForm">
        <input type="hidden" id="f-index" value="-1">
        <div class="form-row">
          <div class="form-group">
            <label>Tên app *</label>
            <input type="text" id="f-name" required placeholder="Facebook">
          </div>
          <div class="form-group">
            <label>Slug (URL) *</label>
            <input type="text" id="f-slug" required placeholder="facebook">
            <small>/facebook</small>
          </div>
        </div>

        <!-- FIELD MỚI: Tên phát hành + Hỗ trợ -->
        <div class="form-row">
          <div class="form-group">
            <label>Tên phát hành</label>
            <input type="text" id="f-publisher" placeholder="Lê Bảo Trung">
            <small>Mặc định: Lê Bảo Trung</small>
          </div>
          <div class="form-group">
            <label>Hỗ trợ (OS)</label>
            <input type="text" id="f-osSupport" placeholder="iOS 15.0+ / Android 10+">
            <small>VD: iOS 15.0+ hoặc Android 10+</small>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Phiên bản</label>
            <input type="text" id="f-version" placeholder="v1.0">
          </div>
          <div class="form-group">
            <label>Dung lượng</label>
            <input type="text" id="f-size" placeholder="100 MB">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Loại *</label>
            <select id="f-type">
              <option value="ipa">IPA</option>
              <option value="tipa">TIPA</option>
              <option value="apk">APK</option>
              <option value="deb">DEB</option>
            </select>
          </div>
          <div class="form-group">
            <label>Link tải *</label>
            <input type="url" id="f-url" required placeholder="https://...">
          </div>
        </div>
        <div class="form-group">
          <label>Mô tả</label>
          <textarea id="f-desc" placeholder="Mô tả ngắn về app..."></textarea>
        </div>
        <div class="form-group">
          <label>Tính năng (mỗi dòng 1 tính năng)</label>
          <textarea id="f-features" placeholder="Tính năng 1&#10;Tính năng 2&#10;Tính năng 3"></textarea>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="f-isNew">
          <label for="f-isNew">Đánh dấu "Mới"</label>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cancelBtn"><svg class="icon"><use href="#i-close"/></svg>Hủy</button>
          <button type="submit" class="btn btn-primary" id="saveBtn"><svg class="icon"><use href="#i-save"/></svg>Lưu lên Firebase</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    // ============================================
    // AUTH
    // ============================================
    const ADMIN_USER = 'admin';
    const ADMIN_PASS = 'trung2011';
    const SESSION_KEY = 'bio_admin_session';
    const SESSION_DURATION = 7 * 24 * 60 * 60 * 1000;
    const $ = s => document.querySelector(s);

    function isLoggedIn() {
      try {
        const raw = localStorage.getItem(SESSION_KEY);
        if (!raw) return false;
        const s = JSON.parse(raw);
        return s.expires && Date.now() < s.expires;
      } catch { return false; }
    }
    function showAdmin() { $('#loginScreen').classList.add('hidden'); $('#adminWrap').classList.add('active'); }
    function showLogin() {
      $('#loginScreen').classList.remove('hidden');
      $('#adminWrap').classList.remove('active');
      setTimeout(() => $('#loginUser').focus(), 100);
    }
    function doLogin() {
      const u = $('#loginUser').value.trim();
      const p = $('#loginPass').value;
      if (u === ADMIN_USER && p === ADMIN_PASS) {
        localStorage.setItem(SESSION_KEY, JSON.stringify({ user: u, expires: Date.now() + SESSION_DURATION }));
        $('#loginError').classList.remove('show');
        showAdmin();
        toast('Đăng nhập thành công');
      } else {
        $('#loginError').classList.add('show');
        $('#loginPass').value = '';
        $('#loginPass').focus();
      }
    }
    $('#loginBtn').addEventListener('click', doLogin);
    $('#loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    $('#loginUser').addEventListener('keydown', e => { if (e.key === 'Enter') $('#loginPass').focus(); });
    $('#togglePass').addEventListener('click', () => {
      const inp = $('#loginPass');
      const icon = $('#togglePassIcon');
      inp.type = inp.type === 'password' ? 'text' : 'password';
      icon.innerHTML = `<use href="${inp.type === 'password' ? '#i-eye' : '#i-eye-off'}"/>`;
    });
    $('#logoutBtn').addEventListener('click', () => {
      if (confirm('Đăng xuất khỏi trang admin?')) {
        localStorage.removeItem(SESSION_KEY);
        showLogin();
        $('#loginUser').value = ''; $('#loginPass').value = '';
      }
    });
    if (isLoggedIn()) showAdmin(); else showLogin();

    // ============================================
    // FIREBASE
    // ============================================
    const firebaseConfig = { databaseURL: "https://bio-app-92915-default-rtdb.asia-southeast1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const appsRef = db.ref('apps');
    const metaRef = db.ref('meta');

    // ============================================
    // STATE
    // ============================================
    let apps = [];
    let firebaseReady = false;
    let isSaving = false;
    let editingIndex = -1;

    function toast(msg, isError) {
      const t = $('#toast');
      t.innerHTML = `<svg class="icon"><use href="${isError ? '#i-alert' : '#i-check'}"/></svg><span>${msg}</span>`;
      t.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 2800);
    }
    function setSyncStatus(state, text) {
      const el = $('#syncStatus');
      el.className = 'sync-status ' + (state === 'ok' ? '' : state);
      $('#syncText').textContent = text;
    }

    // Icon cho preview
    const iconIOSSmall = `<svg viewBox="0 0 100 100" fill="none"><path d="M50 15 L58 38 L82 42 L64 58 L70 82 L50 68 L30 82 L36 58 L18 42 L42 38 Z" fill="#fff" opacity="0.95"/><circle cx="50" cy="50" r="12" fill="#fff" opacity="0.9"/><circle cx="50" cy="50" r="6" fill="#6366f1"/></svg>`;
    const iconAPKSmall = `<svg viewBox="0 0 100 100" fill="none"><rect x="22" y="28" width="56" height="48" rx="14" fill="#fff"/><line x1="50" y1="28" x2="50" y2="16" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="14" r="4" fill="#fff"/><circle cx="37" cy="50" r="6" fill="#059669"/><circle cx="63" cy="50" r="6" fill="#059669"/><path d="M38 64 Q50 70 62 64" stroke="#059669" stroke-width="3" stroke-linecap="round" fill="none"/></svg>`;
    const iconDEBSmall = `<svg viewBox="0 0 100 100" fill="none"><path d="M50 22 C25 22 10 50 10 50 C10 50 25 78 50 78 C75 78 90 50 90 50 C90 50 75 22 50 22 Z" fill="#fff" opacity="0.9"/><circle cx="50" cy="50" r="16" fill="#7c3aed"/><circle cx="50" cy="50" r="10" fill="#a855f7"/><circle cx="50" cy="50" r="4" fill="#fff"/></svg>`;

    function getIconForType(type) {
      const bg = type === 'apk' ? 'linear-gradient(135deg,#10b981,#059669)' : type === 'deb' ? 'linear-gradient(135deg,#a855f7,#7c3aed)' : 'linear-gradient(135deg,#3b82f6,#8b5cf6)';
      const svg = type === 'apk' ? iconAPKSmall : type === 'deb' ? iconDEBSmall : iconIOSSmall;
      return `<div style="width:100%;height:100%;background:${bg};display:flex;align-items:center;justify-content:center;padding:8px;">${svg}</div>`;
    }

    // ============================================
    // LISTENER
    // ============================================
    appsRef.on('value', async snap => {
      const data = snap.val();
      apps = data ? (Array.isArray(data) ? data.filter(Boolean) : Object.keys(data).map(k => data[k]).filter(Boolean)) : [];
      firebaseReady = true;
      renderStats();
      renderList();
      setSyncStatus('ok', `Đã đồng bộ • ${apps.length} app`);
    }, err => {
      console.error(err);
      setSyncStatus('error', 'Lỗi kết nối Firebase');
    });

    // ============================================
    // RENDER
    // ============================================
    function renderStats() {
      const total = apps.length;
      const ipa = apps.filter(a => a.type === 'ipa' || a.type === 'tipa').length;
      const apk = apps.filter(a => a.type === 'apk').length;
      const deb = apps.filter(a => a.type === 'deb').length;
      $('#stats').innerHTML = `
        <div class="stat"><div class="stat-label">Tổng cộng</div><div class="stat-value blue">${total}</div></div>
        <div class="stat"><div class="stat-label">iOS (IPA/TIPA)</div><div class="stat-value">${ipa}</div></div>
        <div class="stat"><div class="stat-label">Android (APK)</div><div class="stat-value green">${apk}</div></div>
        <div class="stat"><div class="stat-label">Jailbreak (DEB)</div><div class="stat-value orange">${deb}</div></div>
      `;
    }

    function renderList() {
      if (!apps.length) {
        $('#appList').innerHTML = `<div class="empty"><svg class="icon"><use href="#i-inbox"/></svg><p>Chưa có app nào. Bấm "Thêm app" để bắt đầu.</p></div>`;
        return;
      }
      $('#appList').innerHTML = apps.map((app, i) => `
        <div class="app-row">
          <div class="app-icon">${getIconForType(app.type)}</div>
          <div class="app-info">
            <div class="app-name">
              ${app.name}
              ${app.isNew ? '<span class="badge" style="background:rgba(244,63,94,0.2);color:#fb7185;">MỚI</span>' : ''}
            </div>
            <div class="app-meta">
              <span class="badge ${app.type}">${app.type.toUpperCase()}</span>
              <span>${app.version || 'v1.0'}</span>
              ${app.size ? `<span>•</span><span>${app.size}</span>` : ''}
              ${app.osSupport ? `<span>•</span><span>${app.osSupport}</span>` : ''}
            </div>
          </div>
          <div class="app-actions">
            <button class="btn btn-ghost btn-sm" data-edit="${i}"><svg class="icon"><use href="#i-edit"/></svg></button>
            <button class="btn btn-danger btn-sm" data-delete="${i}"><svg class="icon"><use href="#i-trash"/></svg></button>
          </div>
        </div>
      `).join('');

      $('#appList').querySelectorAll('[data-edit]').forEach(btn => {
        btn.addEventListener('click', () => openModal(parseInt(btn.dataset.edit)));
      });
      $('#appList').querySelectorAll('[data-delete]').forEach(btn => {
        btn.addEventListener('click', () => deleteApp(parseInt(btn.dataset.delete)));
      });
    }

    // ============================================
    // MODAL
    // ============================================
    function updatePreview() {
      const name = $('#f-name').value || 'Tên app';
      const type = $('#f-type').value;
      const version = $('#f-version').value || 'v1.0';
      $('#previewName').textContent = name;
      $('#previewMeta').textContent = `${version} • ${type.toUpperCase()}`;
      $('#previewIcon').innerHTML = getIconForType(type);
    }

    function openModal(index = -1) {
      editingIndex = index;
      const modal = $('#editModal');
      $('#modalTitle span').textContent = index >= 0 ? 'Sửa app' : 'Thêm app mới';
      if (index >= 0) {
        const app = apps[index];
        $('#f-name').value = app.name || '';
        $('#f-slug').value = app.slug || '';
        $('#f-publisher').value = app.publisher || '';
        $('#f-osSupport').value = app.osSupport || '';
        $('#f-version').value = app.version || '';
        $('#f-size').value = app.size || '';
        $('#f-type').value = app.type || 'ipa';
        $('#f-url').value = app.url || '';
        $('#f-desc').value = app.desc || '';
        $('#f-features').value = (app.features || []).join('\n');
        $('#f-isNew').checked = !!app.isNew;
      } else {
        $('#appForm').reset();
        $('#f-type').value = 'ipa';
      }
      updatePreview();
      modal.classList.add('active');
    }

    function closeModal() { $('#editModal').classList.remove('active'); editingIndex = -1; }

    $('#addBtn').addEventListener('click', () => openModal(-1));
    $('#closeModal').addEventListener('click', closeModal);
    $('#cancelBtn').addEventListener('click', closeModal);
    $('#editModal').addEventListener('click', e => { if (e.target.id === 'editModal') closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    ['f-name', 'f-type', 'f-version'].forEach(id => $('#' + id).addEventListener('input', updatePreview));
    $('#f-type').addEventListener('change', updatePreview);

    // Auto slug
    $('#f-name').addEventListener('input', () => {
      if (editingIndex < 0 && !$('#f-slug').dataset.touched) {
        const slug = $('#f-name').value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        $('#f-slug').value = slug;
      }
    });
    $('#f-slug').addEventListener('input', () => { $('#f-slug').dataset.touched = '1'; });

    // ============================================
    // SAVE / DELETE
    // ============================================
    $('#appForm').addEventListener('submit', async e => {
      e.preventDefault();
      if (isSaving) return;
      isSaving = true;
      $('#saveBtn').disabled = true;

      const app = {
        name: $('#f-name').value.trim(),
        slug: $('#f-slug').value.trim(),
        publisher: $('#f-publisher').value.trim() || 'Lê Bảo Trung',
        osSupport: $('#f-osSupport').value.trim(),
        version: $('#f-version').value.trim(),
        size: $('#f-size').value.trim(),
        type: $('#f-type').value,
        url: $('#f-url').value.trim(),
        desc: $('#f-desc').value.trim(),
        features: $('#f-features').value.split('\n').map(s => s.trim()).filter(Boolean),
        isNew: $('#f-isNew').checked,
        createdAt: editingIndex >= 0 ? (apps[editingIndex].createdAt || new Date().toISOString()) : new Date().toISOString()
      };

      try {
        if (editingIndex >= 0) {
          await appsRef.child(editingIndex).set(app);
          toast('Đã cập nhật app');
        } else {
          await appsRef.push(app);
          toast('Đã thêm app mới');
        }
        closeModal();
      } catch (err) {
        console.error(err);
        toast('Lỗi khi lưu: ' + err.message, true);
      } finally {
        isSaving = false;
        $('#saveBtn').disabled = false;
      }
    });

    async function deleteApp(index) {
      if (!confirm(`Xóa app "${apps[index].name}"?`)) return;
      try {
        await appsRef.child(index).remove();
        toast('Đã xóa app');
      } catch (err) {
        toast('Lỗi khi xóa: ' + err.message, true);
      }
    }
  </script>
</body>
</html>
